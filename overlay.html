<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL '94 Overlay</title>
<!--
  A stream overlay for OBS (a Browser Source) fed by the helper's local live mode (nhl94_helper.py --live-local, which
  writes live/stats.json through tools/live_overlay.py after each update of the game being played). The background is
  transparent. Everything is chosen in the address:
    stats=shots,xg,hits,faceoffs,power_play,save_pct     the numbers, in order (names as in live/stats.json)
    events=goal,big_save,big_miss,post,injury,penalty,giveaway,fight,streak   the kinds shown by default (add big_hit for players
                  upended or sent into the boards, about 7 a game; hit for every knockdown, about 40)
    layout=panel | bar | ticker                          panel: numbers and events; bar: numbers in one row; ticker: events
    recent=4      events shown (newest first)            scale=1   size            side=left | right (panel)
    score=0       hide the score (shown by default at the top of the panel and the start of the bar)
    src=live/stats.json   where the data is              demo=1    a made-up game, for setting OBS up
  Replay (a series played back from video; tools/replay_pack.py makes replay_data.js beside this file):
    replay=1      read replay_data.js instead of the live data
    obs=NAME      follow the OBS Media Source called NAME through OBS's WebSocket (Tools > WebSocket Server Settings):
                  pauses and skips included. obsport=4455, obspw=PASSWORD (if authentication is on)
                  Without obs=, the video time counts from when the page loads (start the video at the same moment).
    delay=0       seconds behind the video (3 or so looks like the live overlay)
    offset=0      seconds added to the video time (nudge if the overlay runs early or late)
    t=SECONDS     start at this video time (for testing without the video)
  A replay pack's replay.html is this page with replay_settings.js loaded first: the same choices, in a file.
-->
<style>
  :root { --bg: rgba(12, 16, 22, 0.78); --fg: #f2f4f7; --muted: #a9b2bf; --line: rgba(255, 255, 255, 0.14);
          --accent: #f5c542; --home: #e8eef6; --away: #e8eef6; --new: rgba(245, 197, 66, 0.28); }
  html, body { margin: 0; background: transparent; color: var(--fg);
               font: 600 16px/1.25 "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #wrap { position: absolute; top: 12px; transform-origin: top left; }
  #wrap.right { right: 12px; transform-origin: top right; }
  #wrap.left { left: 12px; }
  .box { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .hidden { display: none; }
  table { border-collapse: collapse; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  td, th { padding: 2px 8px; text-align: center; white-space: nowrap; }
  td.label { color: var(--muted); font-weight: 500; text-align: center; font-size: 14px; }
  td.num { font-variant-numeric: tabular-nums; min-width: 3.2em; font-size: 18px; }
  .teams th { color: var(--fg); font-size: 16px; }
  .teams th.score { font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: .02em; text-transform: none; }
  .events { margin-top: 6px; max-width: 30em; }
  .ev { padding: 3px 4px; border-top: 1px solid var(--line); font-weight: 500; font-size: 14px; }
  .ev:first-child { border-top: 0; }
  .ev .k { color: var(--accent); font-weight: 700; margin-right: 4px; }
  .ev.fresh { background: var(--new); border-radius: 4px; }
  .bar { display: flex; gap: 14px; align-items: baseline; }
  .bar .stat { display: flex; gap: 6px; align-items: baseline; }
  .bar .stat .label { color: var(--muted); font-size: 13px; text-transform: uppercase; }
  .ticker { font-size: 18px; max-width: 60em; }
  .waiting { color: var(--muted); font-weight: 500; font-size: 14px; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
// The address's choices, over replay_settings.js's (window.NHL94_SETTINGS: a replay pack's replay.html loads it, since
// OBS's "Local file" Browser Source takes no address choices).
const P = new URLSearchParams({ ...(window.NHL94_SETTINGS || {}), ...Object.fromEntries(new URLSearchParams(location.search)) });
for (const [k, v] of [...P]) if (v === '' || v === null) P.delete(k);
const LABELS = { goals: 'Goals', shots: 'Shots', attempts: 'Attempts', xg: 'xG', hits: 'Hits', knockdowns: 'Knockdowns',
  faceoffs: 'Faceoffs', faceoff_pct: 'FO %', passes: 'Passes', pass_pct: 'Pass %', power_play: 'Power play',
  penalties: 'Penalties', pim: 'PIM', save_pct: 'Save %', shooting_pct: 'Shooting %', attack_zone: 'Attack zone',
  one_timers: 'One-timers', breakaways: 'Breakaways', posts: 'Posts', takeaways: 'Takeaways', giveaways: 'Giveaways',
  corsi_pct: 'Corsi %', fenwick_pct: 'Fenwick %', pdo: 'PDO', possession: 'Possession', possession_pct: 'Possession %',
  attack_zone_per_goal: 'Zone time / goal', zone_entries: 'Zone entries', zone_entries_kinds: 'Entries C / P / D',
  bobbled: 'Bobbled passes', checks_person: 'Checks (person)', checks_person_hfw: 'Hit / failed / whiff (person)',
  checks_all: 'Checks (all)', checks_all_hfw: 'Hit / failed / whiff', cb_right: 'C or CB right', cb_right_pct: 'C or CB right %' };
const KIND = { goal: 'GOAL', big_save: 'SAVE', big_miss: 'MISS', big_hit: 'HIT', hit: 'HIT', post: 'POST', injury: 'INJURY',
  penalty: 'PENALTY', giveaway: 'GIVEAWAY', fight: 'FIGHT', streak: 'STREAK' };
const STATS = (P.get('stats') || 'shots,xg,hits,faceoffs,power_play,save_pct').split(',').filter(Boolean);
const KINDS = new Set((P.get('events') || 'goal,big_save,big_miss,post,injury,penalty,giveaway,fight,streak').split(','));
const LAYOUT = P.get('layout') || 'panel';
const RECENT = +(P.get('recent') || (LAYOUT === 'ticker' ? 1 : 4));
const SCORE = P.get('score') !== '0';
const SRC = P.get('src') || 'live/stats.json';
const FRESH_MS = 8000;
const wrap = document.getElementById('wrap');
wrap.className = P.get('side') === 'left' ? 'left' : 'right';
wrap.style.transform = 'scale(' + (+(P.get('scale') || 1)) + ')';
const seen = new Map();   // event id -> first time shown (for the highlight)
let lastGame = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function value(v, k) {
  if (v === null || v === undefined) return '-';
  if (k === 'save_pct' && typeof v === 'number') return v.toFixed(1);   // the labels carry the "%"
  return String(v);
}
// The text after the game time and the kind word ("2nd 4:12 - BIG SAVE: ..." -> time, rest).
function split(e) {
  const t = e.text || '', i = t.indexOf(' - ');
  let rest = i >= 0 ? t.slice(i + 3) : t;
  rest = rest.replace(/^(GOAL|BIG SAVE|BIG MISS|BIG HIT|HIT|OFF THE POST|INJURY|PENALTY|COSTLY GIVEAWAY|FIGHT!?):?\s*/, '');
  return { time: e.period + ' ' + e.clock, rest };
}

function eventsBox(data) {
  const evs = (data.events || []).filter(e => KINDS.has(e.kind)).slice(-RECENT).reverse();
  const box = el('div', 'events');
  const now = Date.now();
  for (const e of evs) {
    const key = data.game + ':' + e.id + ':' + e.kind;
    if (!seen.has(key)) seen.set(key, lastGame === data.game ? now : 0);
    const { time, rest } = split(e);
    const line = el('div', 'ev' + (now - seen.get(key) < FRESH_MS ? ' fresh' : ''));
    line.append(el('span', 'k', KIND[e.kind] || e.kind.toUpperCase()), el('span', '', rest + '  (' + time + ')'));
    box.append(line);
  }
  return evs.length ? box : null;
}

function render(data) {
  wrap.textContent = '';
  if (!data || !data.teams) { wrap.append(el('div', 'box waiting', 'Waiting for a game…')); return; }
  const [h, a] = data.teams;
  if (LAYOUT === 'bar') {
    const bar = el('div', 'box bar');
    if (SCORE) {
      const s = el('div', 'stat');
      s.append(el('span', 'num', h.abbr + ' ' + value(h.stats.goals, 'goals') + ' – ' + value(a.stats.goals, 'goals') + ' ' + a.abbr));
      bar.append(s);
    }
    for (const k of STATS) {
      const s = el('div', 'stat');
      s.append(el('span', 'label', LABELS[k] || k), el('span', 'num', h.abbr + ' ' + value(h.stats[k], k) + ' · ' + value(a.stats[k], k) + ' ' + a.abbr));
      bar.append(s);
    }
    wrap.append(bar);
  } else if (LAYOUT === 'ticker') {
    const box = eventsBox(data);
    if (box) { box.classList.add('box', 'ticker'); wrap.append(box); }
  } else {
    const box = el('div', 'box');
    const table = el('table');
    const head = el('tr', 'teams');
    head.append(el('th', '', h.abbr),
      el('th', 'score', SCORE ? value(h.stats.goals, 'goals') + ' – ' + value(a.stats.goals, 'goals') : ''),
      el('th', '', a.abbr));
    table.append(head);
    for (const k of STATS) {
      const tr = el('tr');
      tr.append(el('td', 'num', value(h.stats[k], k)), el('td', 'label', LABELS[k] || k), el('td', 'num', value(a.stats[k], k)));
      table.append(tr);
    }
    box.append(table);
    const ev = eventsBox(data);
    if (ev) box.append(ev);
    wrap.append(box);
  }
  lastGame = data.game;
}

const DEMO = { status: 'live', game: 'demo', period: '2nd', clock: '4:12', teams: [
  { abbr: 'PHI', stats: { shots: 16, attempts: 21, xg: 2.35, hits: 18, knockdowns: 16, faceoffs: '10/17', faceoff_pct: 59,
    passes: '30/48', pass_pct: 62, power_play: '1/2', save_pct: 84.6, shooting_pct: 19, penalties: 1, pim: 2, attack_zone: '4:58',
    one_timers: '3/5', breakaways: '0/3', posts: 1, takeaways: 10, giveaways: 13, goals: 3 } },
  { abbr: 'CHI', stats: { shots: 13, attempts: 22, xg: 1.76, hits: 23, knockdowns: 22, faceoffs: '7/17', faceoff_pct: 41,
    passes: '21/41', pass_pct: 51, power_play: '0/1', save_pct: 81.3, shooting_pct: 15, penalties: 2, pim: 4, attack_zone: '5:30',
    one_timers: '1/2', breakaways: '0/3', posts: 0, takeaways: 13, giveaways: 14, goals: 2 } }],
  events: [
    { id: 1, kind: 'goal', period: '1st', clock: '3:40', text: '1st 3:40 - GOAL PHI: #8 Mark Recchi (1), from Rod Brind\'Amour [one-timer] - PHI 1-0 CHI' },
    { id: 2, kind: 'penalty', period: '2nd', clock: '1:05', text: '2nd 1:05 - PENALTY CHI: #7 Chris Chelios, Roughing (2 min)' },
    { id: 3, kind: 'post', period: '2nd', clock: '3:20', text: '2nd 3:20 - OFF THE POST: #8 Mark Recchi (PHI)' },
    { id: 4, kind: 'big_save', period: '2nd', clock: '4:12', text: '2nd 4:12 - BIG SAVE: #30 Ed Belfour (CHI) robs #8 Mark Recchi (xG 0.56)' }] };

// ---- Replay: the data for any second of the video, from replay_data.js (window.NHL94_REPLAY):
//   keys       the stat names, in the order of each team's values
//   games      [{game, abbr: [h, a], events: [{..., v: video second it is known}]}]
//   seconds    one entry per video second: null (before the first game) or [game index, home values, away values]
const REPLAY = P.get('replay') ? { delay: +(P.get('delay') || 0), offset: +(P.get('offset') || 0), start: performance.now(),
  t0: +(P.get('t') || 0), obs: P.get('obs'), cursor: null, paused: false } : null;

function replayData(v) {
  const R = window.NHL94_REPLAY;
  if (!R) return null;
  const s = Math.floor(v / (R.step || 1));
  const row = s < 0 ? null : R.seconds[Math.min(s, R.seconds.length - 1)];
  if (!row) return null;
  const g = R.games[row[0]];
  const stats = vals => Object.fromEntries(R.keys.map((k, i) => [k, vals[i]]));
  return { status: 'replay', game: g.game, teams: [{ abbr: g.abbr[0], stats: stats(row[1]) }, { abbr: g.abbr[1], stats: stats(row[2]) }],
           events: g.events.filter(e => e.v <= v) };
}

function videoTime() {
  if (REPLAY.obs) return REPLAY.cursor === null ? -1 : REPLAY.cursor / 1000;
  return REPLAY.t0 + (performance.now() - REPLAY.start) / 1000;
}

// OBS WebSocket (version 5, built into OBS 28 and later): GetMediaInputStatus on the named Media Source, 4 times a second.
// crypto.subtle exists only in a secure context: a page opened from a file in a browser is one, but OBS's "Local file"
// Browser Source serves the page from http://absolute/..., which isn't, so there the hash is worked out here.
function sha256Bytes(bytes) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98,
    0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6,
    0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3,
    0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e,
    0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116,
    0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814,
    0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total);
  m.set(bytes); m[len] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 4, len * 8); dv.setUint32(total - 8, Math.floor(len / 0x20000000));
  const w = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + 4 * i);
    for (let i = 16; i < 64; i++) {
      const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
  }
  const out = new Uint8Array(32);
  H.forEach((v, i) => new DataView(out.buffer).setUint32(4 * i, v));
  return out;
}
async function sha256b64(text) {
  const bytes = new TextEncoder().encode(text);
  const d = (window.crypto && crypto.subtle) ? new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)) : sha256Bytes(bytes);
  return btoa(String.fromCharCode(...d));
}
function obsConnect() {
  const ws = new WebSocket('ws://127.0.0.1:' + (P.get('obsport') || 4455));
  let timer = null, id = 0;
  ws.onmessage = async ev => {
    try {
    const msg = JSON.parse(ev.data);
    if (msg.op === 0) {
      const ident = { rpcVersion: 1 };
      const a = msg.d.authentication;
      if (a) ident.authentication = await sha256b64(await sha256b64((P.get('obspw') || '') + a.salt) + a.challenge);
      ws.send(JSON.stringify({ op: 1, d: ident }));
    } else if (msg.op === 2) {
      REPLAY.obsError = null;
      REPLAY.connected = true;
      timer = setInterval(() => ws.send(JSON.stringify({ op: 6, d: { requestType: 'GetMediaInputStatus',
        requestId: String(++id), requestData: { inputName: REPLAY.obs } } })), 250);
    } else if (msg.op === 7) {
      const r = msg.d.requestStatus;
      if (!r.result) { REPLAY.obsError = 'OBS: ' + (r.comment || 'no Media Source called "' + REPLAY.obs + '"'); return; }
      REPLAY.obsError = null;
      const c = msg.d.responseData.mediaCursor;   // empty while the video is stopped or not started: keep the last
      if (typeof c === 'number') REPLAY.cursor = c;
    }
    } catch (err) { REPLAY.obsError = 'OBS connection: ' + (err && err.message || err); }
  };
  ws.onclose = ev => {
    clearInterval(timer);
    REPLAY.connected = false;
    REPLAY.obsError = ev.code === 4009 ? 'OBS refused the WebSocket password (obspw in replay_settings.js)'
      : REPLAY.obsError || 'OBS WebSocket not connected (Tools > WebSocket Server Settings)';
    setTimeout(obsConnect, 2000);
  };
}

async function tick() {
  if (P.get('demo')) { render(DEMO); return; }
  if (REPLAY) {
    if (!window.NHL94_REPLAY) { wrap.textContent = ''; wrap.append(el('div', 'box waiting', 'replay_data.js not found beside overlay.html')); return; }
    const v = videoTime();
    const data = replayData(v - REPLAY.delay + REPLAY.offset);
    if (REPLAY.obsError && !data) { wrap.textContent = ''; wrap.append(el('div', 'box waiting', REPLAY.obsError)); return; }
    if (REPLAY.obs && REPLAY.cursor === null) {
      wrap.textContent = '';
      wrap.append(el('div', 'box waiting', REPLAY.connected ? 'Waiting for the video to start…' : 'Connecting to OBS…'));
      return;
    }
    render(data);
    return;
  }
  try {
    const r = await fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' });
    render(r.ok ? await r.json() : null);
  } catch (e) { render(null); }
}
function startUp() {
  if (REPLAY && REPLAY.obs) obsConnect();
  tick();
  if (!P.get('demo')) setInterval(tick, +(P.get('refresh') || (REPLAY ? 250 : 1000)));
}
if (REPLAY) {   // replay_data.js beside this page (a script, so it loads from a local file too)
  const s = document.createElement('script');
  s.src = P.get('data') || 'replay_data.js';
  s.onload = s.onerror = startUp;
  document.head.append(s);
} else startUp();
</script>
</body>
</html>
