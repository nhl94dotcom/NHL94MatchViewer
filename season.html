<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL '94 Season Stats</title>
<style>
  :root { --bg: #14181d; --panel: #1e242c; --raised: #2b333d; --text: #e8edf2; --muted: #8b98a7; --team1: #e4572e; --team2: #2e86de; --accent: #f2c744; --ink: #10141a; --good: #4fb477; --bad: #e5484d; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .sub a { color: var(--accent); }
  .card { background: var(--panel); border-radius: 10px; padding: 14px 16px; margin: 0 0 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .filters label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; max-width: 100%; }
  .filters label.wide { flex: 0 1 520px; }
  .filters label.wide select { flex: 1; min-width: 0; width: 100%; }
  .filters select { min-width: 0; }
  @media (max-width: 640px) { .filters label, .filters label.wide { flex: 1 1 100%; } .filters label select { flex: 1; } }
  select { background: var(--raised); color: var(--text); border: 1px solid #3a4450; border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px; max-width: 100%; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
  .tabs button { background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button:hover { color: var(--text); background: var(--raised); }
  .tabs button[aria-selected=true] { color: var(--ink); background: var(--accent); font-weight: 600; }
  .scroll { overflow-x: auto; }
  /* the first column (team or player) stays put while a wide table scrolls sideways */
  .scroll th.left:first-child, .scroll td.left:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 0 8px 8px; text-align: right; white-space: nowrap; }
  th[data-key] { cursor: pointer; user-select: none; }
  th[data-key]:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  th.left, td.left { text-align: left; }
  td { padding: 7px 8px; border-top: 1px solid var(--raised); text-align: right; white-space: nowrap; }
  td.left { white-space: normal; min-width: 130px; }
  td.sorted { color: var(--accent); font-weight: 600; }
  td small, .muted { color: var(--muted); }
  tr.off td { opacity: .45; }
  /* the team you play this season (its sticky first cell needs a solid colour: the panel with a tenth of the accent) */
  tr.mine td, .scroll tr.mine td.left:first-child { background: #33342e; }
  tr.mine td.left:first-child { box-shadow: inset 3px 0 var(--accent); }
  td a { color: var(--text); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--raised); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .tag.you { background: var(--accent); color: var(--ink); font-weight: 600; }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .empty { color: var(--muted); padding: 12px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .tile { background: var(--raised); border-radius: 8px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 13px; }
  .tile b em { font-style: normal; }
  .matrix td, .matrix th { text-align: center; }
  .matrix td.self { background: var(--bg); }
  .matrix td.left, .matrix th.left { text-align: left; }
  .win { color: var(--good); } .loss { color: var(--bad); }
  .btn { background: var(--raised); color: var(--text); border: 1px solid #3a4450; border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--ink); border-color: transparent; font-weight: 600; }
  .btn.danger { color: var(--bad); margin-left: auto; }
  .filters hr { flex-basis: 100%; height: 0; margin: 0; border: 0; }
  input[type=text], input[type=datetime-local] { background: var(--raised); color: var(--text); border: 1px solid #3a4450; border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px; max-width: 100%; color-scheme: dark; }
  .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px 18px; }
  .form label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; min-width: 0; }
  .form label.wide { grid-column: 1 / -1; }
  .form label small { color: var(--muted); }
  select:disabled { opacity: .7; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .heatwrap { display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: flex-start; }
  #heatCanvas { width: 360px; max-width: 100%; height: auto; border-radius: 8px; background: var(--raised); }
  .heatside { flex: 1 1 220px; min-width: 0; }
  /* The bar shared by the games list, the season page and the viewer's help */
  .topnav { display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--raised); }
  .topnav .brand { font-weight: 700; color: var(--text); text-decoration: none; margin-right: 8px; }
  .topnav a.navlink { color: var(--muted); text-decoration: none; padding: 4px 2px; border-bottom: 2px solid transparent; }
  .topnav a.navlink:hover { color: var(--text); }
  .topnav a.navlink[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
  @media (max-width: 640px) { main { padding: 16px 16px 40px; } td, th { padding-left: 6px; padding-right: 6px; } }
</style>
</head>
<body>
<nav class="topnav"><a class="brand" href="helper.html">NHL '94 Viewer</a><a class="navlink" href="helper.html">Games</a><a class="navlink" href="season.html" aria-current="page">Season stats</a><a class="navlink" href="viewer.html#help">Help</a></nav>
<main>
  <h1>Season stats</h1>
  <p class="sub" id="sub">Loading games&hellip;</p>

  <section class="card filters" id="filters" hidden>
    <label class="wide">Season <select id="season"></select></label>
    <button class="btn" id="editSeason" hidden>Edit season</button>
    <button class="btn" id="newSeason" hidden>New season</button>
    <hr>
    <label class="wide" id="romLabel">Games played on <select id="rom"></select></label>
    <label id="mineLabel" title="The team you control in these games">My team <select id="mine"></select></label>
    <label>Team <select id="team"></select></label>
    <label title="Recordings that began after the opening faceoff or stopped before the final horn"><input type="checkbox" id="whole" checked> Whole games only</label>
  </section>

  <section class="card" id="editor" hidden>
    <h2 id="editorTitle">New season</h2>
    <div class="form">
      <label>Name <input type="text" id="eName" maxlength="80" placeholder="e.g. GENS Classic season 12"></label>
      <label>My team <select id="eTeam"></select></label>
      <label class="wide">ROM <select id="eRom"></select>
        <small id="eRomNote" hidden>A season stays on its ROM. To play another ROM, start a new season.</small></label>
      <label>Starts <input type="datetime-local" id="eStart"></label>
      <label>Ends (optional) <input type="datetime-local" id="eEnd"></label>
    </div>
    <p class="note">The season counts the whole games played on its ROM from its start until it ends, or until the
      next season on the same ROM starts. Set the start earlier to take in games already played. Deleting a season
      keeps its games.</p>
    <div class="actions">
      <button class="btn primary" id="eSave">Save season</button>
      <button class="btn" id="eCancel">Cancel</button>
      <button class="btn danger" id="eDelete">Delete season</button>
    </div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button data-tab="standings" aria-selected="true">Standings</button>
    <button data-tab="skaters">Skaters</button>
    <button data-tab="goalies">Goalies</button>
    <button data-tab="teams">Team stats</button>
    <button data-tab="h2h">Head to head</button>
    <button data-tab="adv">Advanced</button>
    <button data-tab="play">Play style</button>
    <button data-tab="heat">Heat maps</button>
    <button data-tab="games">Games</button>
  </nav>

  <section class="card" id="view" hidden></section>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (a, b, digits = 1) => (b ? (100 * a / b).toFixed(digits) + '%' : '–');
const svp = (sa, ga) => (sa ? ((sa - ga) / sa).toFixed(3).replace(/^0/, '') : '–');
const per = (a, gp, digits = 1) => (gp ? (a / gp).toFixed(digits) : '–');
const mmss = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const signed = v => (v > 0 ? '+' + v : String(v));

let games = [], tab = 'standings', sorts = {}, myTeams = {}, mineGuessed = false;
let seasons = [], romTeams = {}, romNames = {}, seasonId = null, canSave = false, editing = null;
try {
  const saved = JSON.parse(localStorage.getItem('nhl94.season') || '{}');
  tab = saved.tab || tab; sorts = saved.sorts || {}; myTeams = saved.myTeams || {};
  if ('seasonId' in saved) seasonId = saved.seasonId;
} catch (e) { /* no storage */ }
const query = new URLSearchParams(location.search);  // ?tab=skaters opens that tab
if (query.get('tab')) tab = query.get('tab');
const remember = () => { try { localStorage.setItem('nhl94.season', JSON.stringify({ tab, sorts, myTeams, seasonId })); } catch (e) { /* no storage */ } };
// Games unticked on the Games tab: a season keeps its own (saved with it); browsing without a season, until reload.
const looseExcluded = new Set();
const excludedSet = () => { const s = currentSeason(); return s ? new Set(s.excluded || []) : looseExcluded; };

// The games: from the helper (/api/season) when it serves this page, else from matches/season.js beside it
// (python tools/season.py writes it).
async function load() {
  try {
    const r = await fetch('/api/season', { cache: 'no-store' });
    if (r.ok) { canSave = true; return await r.json(); }
  } catch (e) { /* opened from the folder */ }
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'matches/season.js?' + Date.now();
    s.onload = () => resolve(window.NHL94_SEASON || {});
    s.onerror = () => resolve(null);
    document.head.append(s);
  });
}

const romKey = g => g.system + ':' + (g.rom || '?');
// A ROM's name: its file name in RetroArch when the helper could find it (NHL94_Classic, SDL16), else its checksum.
const systemName = key => (key.startsWith('snes') ? 'SNES' : 'Genesis');
const romName = key => romNames[key] || systemName(key) + ' ROM ' + key.split(':')[1];
function romLabel(key) {
  const list = games.filter(g => romKey(g) === key), whole = list.filter(g => g.finished && g.fromStart), [system, rom] = key.split(':');
  const teams = [...new Set((whole.length ? whole : list).flatMap(g => g.abbr))].sort();
  const parts = list.length - whole.length;
  return romName(key) + (romNames[key] ? ' (' + systemName(key) + ')' : '') + ' · ' + whole.length + ' whole game' + (whole.length === 1 ? '' : 's') +
    (parts ? ', ' + parts + ' part' + (parts === 1 ? '' : 's') : '') + (teams.length ? ' (' + teams.slice(0, 4).join(', ') + (teams.length > 4 ? '…' : '') + ')' : '');
}

// ---------------------------------------------------------------------------------------------------- seasons
const currentSeason = () => seasons.find(s => s.id === seasonId) || null;
const byStart = (a, b) => (b.start || '').localeCompare(a.start || '');
// A season runs to its end, or to the start of the same ROM's next season, whichever is first.
function seasonEnd(s) {
  const next = seasons.filter(o => o !== s && o.rom === s.rom && (o.start || '') > (s.start || '')).map(o => o.start).sort()[0];
  return [s.end, next].filter(Boolean).sort()[0] || '';
}
function inSeason(g, s) {
  const d = g.date || '', end = seasonEnd(s);
  return romKey(g) === s.rom && d >= (s.start || '') && (!end || d < end);
}
const when = d => (d ? d.replace('T', ' ') : '');
const teamName = (rom, abbr) => (teamsOf(rom).find(t => t[0] === abbr) || [abbr, abbr])[1];
// Every team a ROM has: from the copied ROM when the helper has it, plus any seen in its games.
function teamsOf(rom) {
  const teams = new Map(romTeams[rom] || []);
  for (const g of games) if (romKey(g) === rom) g.abbr.forEach((a, i) => teams.has(a) || teams.set(a, g.names[i]));
  return [...teams].sort((a, b) => a[1].localeCompare(b[1]));
}

function fillSeasons() {
  $('season').innerHTML = [...seasons].sort(byStart).map(s => `<option value="${esc(s.id)}">${esc(s.name)} · ${esc(romName(s.rom))}</option>`).join('') +
    '<option value="">No season: browse all games</option>';
  if (seasonId === null || (seasonId && !currentSeason())) seasonId = seasons.length ? [...seasons].sort(byStart)[0].id : '';
  $('season').value = seasonId;
  const s = currentSeason();
  $('romLabel').hidden = $('mineLabel').hidden = !!s;
  $('editSeason').hidden = !s || !canSave;
  $('newSeason').hidden = !canSave;
}

async function saveSeasons() {
  try {
    const r = await fetch('/api/seasons', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-NHL94': '1' }, body: JSON.stringify({ seasons }) });
    if (!r.ok) throw new Error(r.status);
    seasons = (await r.json()).seasons;
    return true;
  } catch (e) {
    alert('The season could not be saved. Is the helper still running?');
    return false;
  }
}

function nowLocal() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }

function fillEditorTeams(keep) {
  const teams = teamsOf($('eRom').value);
  $('eTeam').innerHTML = '<option value="">Choose&hellip;</option>' + teams.map(([a, n]) => `<option value="${esc(a)}">${esc(n)} (${esc(a)})</option>`).join('');
  $('eTeam').value = teams.some(t => t[0] === keep) ? keep : '';
}

function openEditor(s) {
  editing = s;
  const roms = [...new Set([...games.map(romKey), ...Object.keys(romTeams), ...seasons.map(o => o.rom)])];
  const recent = games.find(g => g.finished && g.fromStart) || games[0];
  const rom = s ? s.rom : $('rom').value || (recent ? romKey(recent) : roms[0] || '');
  $('editorTitle').textContent = s ? 'Edit season' : 'New season';
  $('eRom').innerHTML = roms.map(k => `<option value="${esc(k)}">${esc(romLabel(k))}</option>`).join('');
  $('eRom').value = rom;
  // A season keeps its ROM once made (its games are that ROM's); its name, team and dates can change.
  $('eRom').disabled = !!s;
  $('eRomNote').hidden = !s;
  $('eName').value = s ? s.name : 'Season ' + (seasons.filter(o => o.rom === rom).length + 1);
  fillEditorTeams(s ? s.team : myTeams[rom] || (rom === $('rom').value ? myTeam() : ''));
  $('eStart').value = s ? s.start : nowLocal();
  $('eEnd').value = s ? s.end || '' : '';
  $('eDelete').hidden = !s;
  $('editor').hidden = false;
  $('eName').focus();
}

function wireEditor() {
  $('newSeason').addEventListener('click', () => openEditor(null));
  $('editSeason').addEventListener('click', () => openEditor(currentSeason()));
  $('eCancel').addEventListener('click', () => { $('editor').hidden = true; });
  $('eRom').addEventListener('change', () => fillEditorTeams($('eTeam').value));
  $('eSave').addEventListener('click', async () => {
    const name = $('eName').value.trim(), team = $('eTeam').value, start = $('eStart').value, end = $('eEnd').value;
    if (!name) return alert('Give the season a name.');
    if (!team) return alert('Choose the team you play this season.');
    if (!start) return alert('Choose when the season starts.');
    if (end && end <= start) return alert('The season has to end after it starts.');
    const s = editing || { id: Date.now().toString(36), excluded: [] };
    Object.assign(s, { name, rom: $('eRom').value, team, start, end });
    if (!editing) seasons.push(s);
    if (await saveSeasons()) {
      seasonId = s.id; remember();
      $('editor').hidden = true; fillSeasons(); fillTeams(); render();
    }
  });
  $('eDelete').addEventListener('click', async () => {
    if (!editing || !confirm(`Delete the season "${editing.name}"? Its games are kept.`)) return;
    seasons = seasons.filter(o => o !== editing);
    if (await saveSeasons()) {
      seasonId = null; remember();
      $('editor').hidden = true; fillSeasons(); fillTeams(); render();
    }
  });
}

function setup() {
  const roms = [...new Set(games.map(romKey))];
  // Default: the ROM of the most recent whole game (a league season is played on one ROM)
  const recent = games.find(g => g.finished && g.fromStart) || games[0];
  $('rom').innerHTML = '<option value="">All ROMs</option>' + roms.map(k => `<option value="${esc(k)}">${esc(romLabel(k))}</option>`).join('');
  $('rom').value = query.has('rom') ? (roms.includes(query.get('rom')) ? query.get('rom') : '') : recent ? romKey(recent) : '';
  for (const el of [$('rom'), $('team'), $('whole')]) el.addEventListener('change', () => { if (el !== $('team')) fillTeams(); render(); });
  $('mine').addEventListener('change', () => {
    if ($('mine').value) myTeams[$('rom').value || 'all'] = $('mine').value; else delete myTeams[$('rom').value || 'all'];
    remember(); fillTeams(); render();
  });
  for (const b of document.querySelectorAll('#tabs button')) b.addEventListener('click', () => { tab = b.dataset.tab; remember(); render(); });
  $('season').addEventListener('change', () => { seasonId = $('season').value; remember(); fillSeasons(); fillTeams(); render(); });
  if (query.has('rom')) seasonId = '';  // a ROM in the address: browse it, not a season
  wireEditor();
  fillSeasons();
  fillTeams();
  $('filters').hidden = $('tabs').hidden = $('view').hidden = false;
}

function fillTeams() {
  const keep = $('team').value, teams = new Map();
  for (const g of pool(false)) g.abbr.forEach((a, i) => teams.set(a, g.names[i]));
  $('team').innerHTML = '<option value="">All teams</option>' + [...teams].sort((a, b) => a[1].localeCompare(b[1]))
    .map(([a, n]) => `<option value="${esc(a)}">${esc(n)} (${esc(a)})</option>`).join('');
  $('team').value = teams.has(keep) ? keep : '';
  // My team, chosen once per ROM (a league season is one ROM, one team). Not chosen yet: the one team that played
  // every game, if there is one, as a guess.
  const chosen = myTeams[$('rom').value || 'all'], list = pool(false);
  const everyGame = [...teams.keys()].filter(a => list.length >= 2 && list.every(g => g.abbr.includes(a)));
  mineGuessed = !currentSeason() && !teams.has(chosen) && everyGame.length === 1;
  $('mine').innerHTML = '<option value="">Not chosen</option>' + [...teams].sort((a, b) => a[1].localeCompare(b[1]))
    .map(([a, n]) => `<option value="${esc(a)}">${esc(n)} (${esc(a)})${mineGuessed && a === everyGame[0] ? ' - guessed' : ''}</option>`).join('');
  $('mine').value = teams.has(chosen) ? chosen : mineGuessed ? everyGame[0] : '';
}
const myTeam = () => { const s = currentSeason(); return s ? s.team : $('mine').value; };

// The games in play: the ROM and whole-game filters (and, with byTeam, the team filter), less any unticked on the
// Games tab.
function pool(byTeam = true, withExcluded = false) {
  const s = currentSeason(), rom = s ? s.rom : $('rom').value, team = $('team').value, whole = $('whole').checked, excluded = excludedSet();
  return games.filter(g => (!rom || romKey(g) === rom) && (!s || inSeason(g, s)) && (!whole || (g.finished && g.fromStart)) &&
    (!byTeam || !team || g.abbr.includes(team)) && (withExcluded || !excluded.has(g.name)));
}

// ---------------------------------------------------------------------------------------------------- totals
function standings(list) {
  const rows = new Map();
  const row = (abbr, name) => rows.get(abbr) || rows.set(abbr, { abbr, name, gp: 0, w: 0, l: 0, otl: 0, t: 0, gf: 0, ga: 0, sog: 0, sa: 0, att: 0, attA: 0,
    ppg: 0, ppTries: 0, ppgA: 0, pkTimes: 0, assisted: 0, shg: 0, pim: 0, fow: 0, fo: 0, checks: 0, bigHits: 0, passTried: 0, passMade: 0, attackZone: 0,
    breakTried: 0, breakGoals: 0, oneTimerTried: 0, oneTimerGoals: 0, give: 0, take: 0, humanGames: 0, seconds: 0 }).get(abbr);
  for (const g of list) {
    for (const side of [0, 1]) {
      const r = row(g.abbr[side], g.names[side]), t = g.teams[side];
      r.gp++; r.seconds += g.seconds;
      if (g.humans[side]) r.humanGames++;
      for (const k of Object.keys(t)) if (k in r && !Array.isArray(t[k])) r[k] += t[k];
      for (const k of ['adv', 'advEv', 'hd', 'reb', 'flip', 'toShot', 'entries']) if (t[k]) { r[k] = r[k] || t[k].map(() => 0); t[k].forEach((x, i) => { r[k][i] += x; }); }
      if (!g.finished) continue;
      if (t.gf > t.ga) r.w++; else if (t.gf === t.ga) r.t++; else if (g.overtime) r.otl++; else r.l++;
    }
  }
  for (const r of rows.values()) r.pts = 2 * r.w + r.otl + r.t;
  return [...rows.values()];
}

function playerLines(list, goalies) {
  const rows = new Map();
  for (const g of list) for (const side of [0, 1]) for (const p of g.players[side]) {
    if (p.goalie !== goalies) continue;
    const key = g.abbr[side] + '|' + p.name;
    let r = rows.get(key);
    if (!r) rows.set(key, r = { name: p.name, num: p.num, abbr: g.abbr[side], ovr: p.ovr, gp: 0, toi: 0 });
    r.gp++; r.toi += p.toi || 0;
    for (const [k, v] of Object.entries(p)) {
      if (['idx', 'name', 'num', 'goalie', 'ovr', 'toi', 'dec'].includes(k)) continue;
      if (Array.isArray(v)) { r[k] = r[k] || v.map(() => 0); v.forEach((x, i) => { r[k][i] += x; }); } else r[k] = (r[k] || 0) + v;
    }
    if (p.dec) { r[p.dec] = (r[p.dec] || 0) + 1; }
  }
  return [...rows.values()];
}

// ---------------------------------------------------------------------------------------------------- tables
// A sortable table: columns {key, label, value(row) for sorting, show(row) for display, title, left, asc}.
function table(id, rows, columns, defaultKey) {
  const s = sorts[id] || { key: defaultKey, asc: false };
  const col = columns.find(c => c.key === s.key) || columns.find(c => c.key === defaultKey);
  const val = c => r => (c.value ? c.value(r) : r[c.key]);
  const get = val(col);
  rows = [...rows].sort((a, b) => {
    const x = get(a), y = get(b);
    const cmp = typeof x === 'string' ? x.localeCompare(y) : (x == null || isNaN(x) ? -Infinity : x) - (y == null || isNaN(y) ? -Infinity : y);
    return (s.asc ? cmp : -cmp) || (b.gp || 0) - (a.gp || 0);
  });
  const head = columns.map(c => `<th${c.sortable === false ? '' : ` data-key="${c.key}"`} class="${c.left ? 'left' : ''}${c === col ? ' sorted' : ''}"${c.title ? ` title="${esc(c.title)}"` : ''}>${esc(c.label)}${c === col ? (s.asc ? ' ▴' : ' ▾') : ''}</th>`).join('');
  const body = rows.map(r => `<tr class="${r.off ? 'off' : ''}${r.abbr && r.abbr === myTeam() ? ' mine' : ''}">` + columns.map(c => {
    const v = c.show ? c.show(r) : esc(val(c)(r));
    return `<td class="${c.left ? 'left' : ''}${c === col ? ' sorted' : ''}">${v}</td>`;
  }).join('') + '</tr>').join('');
  const html = `<div class="scroll"><table data-table="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  return html;
}
function wireSorting() {
  for (const th of document.querySelectorAll('th[data-key]')) th.addEventListener('click', () => {
    const id = th.closest('table').dataset.table, key = th.dataset.key, s = sorts[id];
    sorts[id] = { key, asc: s && s.key === key ? !s.asc : th.classList.contains('left') };
    remember(); render();
  });
}

function viewH2H(list, team) {
  const teams = standings(list).sort((a, b) => a.name.localeCompare(b.name));
  if (teams.length > 12 && !team) {
    // Too many for a grid: list the pairings that were played
    return '<h2>Head to head</h2>' + pairings(list, team);
  }
  const shown = team ? teams.filter(t => t.abbr === team) : teams;
  const cell = (a, b) => {
    const r = { w: 0, l: 0, otl: 0, t: 0, gf: 0, ga: 0, gp: 0 };
    for (const g of list) {
      const i = g.abbr.indexOf(a.abbr), j = g.abbr.indexOf(b.abbr);
      if (i < 0 || j < 0 || i === j) continue;
      r.gp++; r.gf += g.score[i]; r.ga += g.score[j];
      if (!g.finished) continue;
      if (g.score[i] > g.score[j]) r.w++; else if (g.score[i] === g.score[j]) r.t++; else if (g.overtime) r.otl++; else r.l++;
    }
    if (!r.gp) return '<td class="muted">·</td>';
    const cls = r.w > r.l + r.otl ? 'win' : r.w < r.l + r.otl ? 'loss' : '';
    return `<td class="${cls}" title="${esc(a.name)} against ${esc(b.name)}: ${r.gp} game${r.gp === 1 ? '' : 's'}, goals ${r.gf}-${r.ga}">${r.w}-${r.l}-${r.otl}${r.t ? '-' + r.t : ''}</td>`;
  };
  const head = '<th class="left">Record against →</th>' + teams.map(t => `<th title="${esc(t.name)}">${esc(t.abbr)}</th>`).join('');
  const body = shown.map(a => `<tr><td class="left">${esc(a.name)} <small>${esc(a.abbr)}</small></td>` +
    teams.map(b => (a.abbr === b.abbr ? '<td class="self"></td>' : cell(a, b))).join('') + '</tr>').join('');
  return `<h2>Head to head</h2><div class="scroll"><table class="matrix"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` +
    '<p class="note">Each row’s record (W-L-OTL) against each column. Point at a record for the goals.</p>' + pairings(list, team);
}
function pairings(list, team) {
  const pairs = new Map();
  for (const g of list) {
    if (team && !g.abbr.includes(team)) continue;
    const order = [0, 1].sort((x, y) => g.abbr[x].localeCompare(g.abbr[y])), key = order.map(i => g.abbr[i]).join('-');
    const p = pairs.get(key) || pairs.set(key, { a: order.map(i => g.names[i]), abbr: order.map(i => g.abbr[i]), gp: 0, wins: [0, 0], goals: [0, 0] }).get(key);
    p.gp++;
    order.forEach((i, n) => { p.goals[n] += g.score[i]; });
    if (g.finished && g.score[0] !== g.score[1]) p.wins[g.score[order[0]] > g.score[order[1]] ? 0 : 1]++;
  }
  const rows = [...pairs.values()].map(p => ({ ...p, name: p.a.join(' – ') }));
  return '<h2 style="margin-top:22px">Matchups</h2>' + table('pairs', rows, [
    { key: 'name', label: 'Teams', left: true, show: r => `${esc(r.a[0])} <small>${esc(r.abbr[0])}</small> – ${esc(r.a[1])} <small>${esc(r.abbr[1])}</small>` },
    { key: 'gp', label: 'GP' },
    { key: 'wins', label: 'Wins', value: r => r.wins[0] - r.wins[1], show: r => `${r.wins[0]}–${r.wins[1]}` },
    { key: 'goals', label: 'Goals', value: r => r.goals[0] + r.goals[1], show: r => `${r.goals[0]}–${r.goals[1]}` },
  ], 'gp');
}

      <div class="heatside"><p id="heatCaption" class="note" style="margin:0">Loading the games&hellip;</p>
      <p class="note">${heatMode === 'puck' ? 'Where the puck was while they had it.' : heatWho.player ? 'Everywhere he went while on the ice in live play, puck or not.' : 'Where the team\u2019s skaters went in live play, puck or not (goalies left out).'}
      Each game is turned so the team attacks up the screen. Brighter red: more time there. Stoppages are left out.</p></div></div>`;
}

function wireHeat(list) {
  $('hTeam').value = heatWho.team; $('hPlayer').value = heatWho.player; $('hMode').value = heatMode; $('hSlice').value = heatSlice;
  $('hTeam').addEventListener('change', e => { heatWho = { team: e.target.value, player: '' }; render(); });
  $('hPlayer').addEventListener('change', e => { heatWho.player = e.target.value; render(); });
  $('hMode').addEventListener('change', e => { heatMode = e.target.value; render(); });
  $('hSlice').addEventListener('change', e => { heatSlice = e.target.value; render(); });
  drawSeasonHeat(list);
}

async function drawSeasonHeat(list) {
  const want = list.filter(g => g.abbr.includes(heatWho.team));
  await loadHeat(want.map(g => g.name));
  const canvas = $('heatCanvas');
  if (!canvas) return;  // the page moved on while loading
  const system = want.length && want.every(g => g.system === 'snes') ? 'snes' : 'genesis', pic = RINK_PICS[system];
  const img = await rinkImage(system);
  if ($('heatCanvas') !== canvas) return;
  // Add the games up
  let cols = 26, rows = 60, cell = 10, sum = null, secs = 0, used = 0, missing = 0;
  const slice = heatMode === 'puck' ? 'puck' : heatSlice || 'skate';
  for (const g of want) {
    const h = window.NHL94_HEAT[g.name];
    if (!h) { missing++; continue; }
    cols = h.cols; rows = h.rows; cell = h.cell;
    if (!sum) sum = new Float32Array(cols * rows);
    let any = false;
    g.abbr.forEach((a, side) => {
      if (a !== heatWho.team) return;
      let e = h.teams[side];
      if (heatWho.player) {
        const p = g.players[side].find(q => !q.goalie && q.name === heatWho.player);
        e = p ? h.players[side][String(p.idx)] : null;
      }
      if (!e) return;
      any = true;
      secs += e.s[slice] || 0;
      const packed = e.g[slice] || [];
      for (let j = 0, at = -1; j < packed.length; j += 2) { at += packed[j] + 1; sum[at] += packed[j + 1] / 10; }
    });
    if (any) used++;
  }
  // Draw: the rink picture, the map over it
  const ctx = canvas.getContext('2d'), scale = canvas.width / 900;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  else { ctx.fillStyle = '#7ee2f5'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  if (sum) {
    const heat = heatPicture(sum, cols, rows, heatMode === 'skate');
    ctx.imageSmoothingEnabled = true;
    const x0 = (pic.cx - 130 * pic.ux) * scale, y0 = (pic.cy - 300 * pic.uy) * scale;
    ctx.drawImage(heat, x0, y0, 260 * pic.ux * scale, 600 * pic.uy * scale);
  }
  // An arrow: the way the team attacks
  ctx.fillStyle = 'rgba(16,20,26,.8)'; ctx.fillRect(8, 8, 92, 24);
  ctx.fillStyle = '#e8edf2'; ctx.font = '600 13px system-ui, sans-serif'; ctx.fillText('\u2191 Attacking', 16, 25);
  const who = heatWho.player ? heatWho.player : (list.find(g => g.abbr.includes(heatWho.team)) || { names: [heatWho.team], abbr: [heatWho.team] });
  const label = heatWho.player || who.names[who.abbr.indexOf(heatWho.team)];
  const time = mmss(secs) + (heatMode === 'puck' ? ' with the puck' : heatWho.player ? ' on the ice' : ' of play');
  $('heatCaption').innerHTML = `<b style="color:var(--text)">${esc(label)}</b> · ${heatMode === 'puck' ? 'with the puck' : esc(HEAT_SLICES[heatSlice].toLowerCase())}` +
    `<br>${used} game${used === 1 ? '' : 's'} · ${time}` + (missing ? `<br>${missing} game${missing === 1 ? ' has' : 's have'} no heat map yet (the helper makes them).` : '');
}

// The summed grid as a picture: smoothed (two passes of a 3-cell box blur each way), scaled to the busiest cells
// (97th percentile), yellow through red; skating maps with more contrast, as in the viewer.
function heatPicture(grid, cols, rows, skating) {
  let a = Float32Array.from(grid);
  const b = new Float32Array(a.length);
  for (let pass = 0; pass < 2; pass++) {
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      let s = 0; for (let d = -1; d <= 1; d++) { const cc = c + d; if (cc >= 0 && cc < cols) s += a[r * cols + cc]; } b[r * cols + c] = s / 3;
    }
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      let s = 0; for (let d = -1; d <= 1; d++) { const rr = r + d; if (rr >= 0 && rr < rows) s += b[rr * cols + c]; } a[r * cols + c] = s / 3;
    }
  }
  const used = [...a].filter(v => v > 0).sort((x, y) => x - y);
  const top = Math.max(1e-6, used.length ? used[Math.floor(used.length * 0.97)] : 1);
  const out = document.createElement('canvas');
  out.width = cols; out.height = rows;
  const g = out.getContext('2d'), data = g.createImageData(cols, rows);
  const stops = [[255, 236, 110], [255, 150, 20], [205, 25, 25]];
  for (let i = 0; i < a.length; i++) {
    const v = Math.min(1, Math.pow(a[i] / top, skating ? 1.6 : 0.7));
    if (v < (skating ? 0.12 : 0.06)) continue;
    const x = Math.min(1.999, v * 2), k = Math.floor(x), u = x - k;
    for (let j = 0; j < 3; j++) data.data[4 * i + j] = Math.round(stops[k][j] + (stops[k + 1][j] - stops[k][j]) * u);
    data.data[4 * i + 3] = Math.round(255 * (0.2 + 0.65 * v));
  }
  g.putImageData(data, 0, 0);
  return out;
}

// ---------------------------------------------------------------------------------------------------- advanced
// The NHL analysts' stats, from the summaries' on-ice numbers: eight per skater and team, [CF, CA, FF, FA, SF, SA,
// GF, GA] (Corsi: every shot attempt; Fenwick: those not blocked; shots on goal; goals), in all situations or at

let advEven = false, advOnIce = false;

const ADV = { cf: 0, ca: 1, ff: 2, fa: 3, sf: 4, sa: 5, gf: 6, ga: 7 };

function advCols(get) {

  const v = (r, k) => (get(r) || [])[ADV[k]] || 0;

  return [

    { key: 'ca', label: 'CA', title: 'Corsi against', value: r => v(r, 'ca') },
    { key: 'cfp', label: 'CF%', title: 'Share of the shot attempts', value: r => share(v(r, 'cf'), v(r, 'ca')), show: r => pct1(share(v(r, 'cf'), v(r, 'ca'))) },

// ---------------------------------------------------------------------------------------------------- play style
// From the summaries' play context: how each team's chances came about, the person against the computer, what each
// person did with the controller, and who passes to whom.
const sumArr = (a, b) => (b ? (a ? a.map((x, i) => x + (b[i] || 0)) : [...b]) : a);
function playTotals(list) {
  // Per team: the play-context lists summed, the habits of its person's games, its goalies' person / CPU shots.
  const rows = new Map();
  for (const g of list) g.abbr.forEach((abbr, side) => {
    const t = g.teams[side];
    const r = rows.get(abbr) || rows.set(abbr, { abbr, name: g.names[side], gp: 0, humanGames: 0, habits: null, habitGames: 0, pairs: {}, gHuman: [0, 0], gCpu: [0, 0] }).get(abbr);
    r.gp++;
    if (g.humans[side]) r.humanGames++;
    for (const k of ['persHits', 'persPen', 'origin', 'oddMan', 'wrap', 'humanPasses']) r[k] = sumArr(r[k], t[k]);
    if (t.habits) {
      r.habitGames++;
      const h = r.habits || (r.habits = { minutes: 0, presses: { A: 0, B: 0, C: 0 }, bursts: 0, checks: 0, pokes: 0, pokeTakeaways: 0, hooks: 0, hookTakeaways: 0, dives: 0, goalieSeconds: 0 });
      for (const k of Object.keys(h)) if (k === 'presses') for (const b of 'ABC') h.presses[b] += t.habits.presses[b] || 0; else h[k] += t.habits[k] || 0;
    }
    // Passing pairs by name (players are matched across games by name)
    const name = idx => ((g.players[side].find(p => p.idx === idx) || {}).name || '#' + idx);
    for (const [key, v] of Object.entries(t.pairs || {})) {
      const [a, b] = key.split('>').map(Number), k = name(a) + '\u2192' + name(b);
      r.pairs[k] = sumArr(r.pairs[k], v);
    }
    for (const p of g.players[side]) if (p.goalie) { r.gHuman = sumArr(r.gHuman, p.human); r.gCpu = sumArr(r.gCpu, p.cpu); }
  });
  return [...rows.values()];
}

function viewPlay(list, team) {

    { key: 'hitsP', label: 'Checks: person', value: r => ph(r, 0) },
    { key: 'hitsC', label: 'CPU', value: r => ph(r, 1) },
    { key: 'hitsShare', label: 'Person %', value: r => share(ph(r, 0), ph(r, 1)), show: r => pct1(share(ph(r, 0), ph(r, 1))) },
    { key: 'penP', label: 'Penalties: person', value: r => pp(r, 0) },
    { key: 'penC', label: 'CPU', value: r => pp(r, 1) },
    { key: 'svH', label: 'SV% person in net', title: 'Shots faced with a person controlling the goalie at the release', value: r => (r.gHuman[0] ? 1 - r.gHuman[1] / r.gHuman[0] : NaN), show: r => sv(r.gHuman) },
    { key: 'svC', label: 'SV% CPU in net', value: r => (r.gCpu[0] ? 1 - r.gCpu[1] / r.gCpu[0] : NaN), show: r => sv(r.gCpu) },
  ], 'humanGames') : '<p class="empty">No games with a person in them.</p>';
  const withHabits = rows.filter(r => r.habits && (!team || r.abbr === team));
  const hm = (r, n) => (r.habits.minutes ? n / r.habits.minutes : NaN);
  const habits = withHabits.length ? table('playHabits', withHabits, [
    { key: 'name', label: 'Team', left: true, show: teamCell },
    { key: 'habitGames', label: 'GP', title: 'Games with this team\u2019s controller recorded' },
    ...['A', 'B', 'C'].map(b => ({ key: 'p' + b, label: b + '/min', title: `${b} presses a minute of live play`, value: r => hm(r, r.habits.presses[b]), show: r => hm(r, r.habits.presses[b]).toFixed(1) })),
    { key: 'bursts', label: 'Bursts/min', title: 'C without the puck: speed bursts and check lunges, a minute', value: r => hm(r, r.habits.bursts), show: r => hm(r, r.habits.bursts).toFixed(1) },
    { key: 'checks', label: 'Checks/GP', title: 'Checks the person\u2019s skater landed, a game', value: r => r.habits.checks / r.habitGames, show: r => per(r.habits.checks, r.habitGames) },
    { key: 'pokes', label: 'Pokes/GP', value: r => r.habits.pokes / r.habitGames, show: r => per(r.habits.pokes, r.habitGames) },
    { key: 'pokeTk', label: 'Poke \u2192 takeaway', title: 'Poke checks that took the puck', value: r => (r.habits.pokes ? r.habits.pokeTakeaways / r.habits.pokes : NaN), show: r => (r.habits.pokes ? pct1(100 * r.habits.pokeTakeaways / r.habits.pokes) : '–') },
    { key: 'hooks', label: 'Hooks/GP', value: r => r.habits.hooks / r.habitGames, show: r => per(r.habits.hooks, r.habitGames) },
    { key: 'passPct', label: 'Pass %', title: 'Passes by the person\u2019s skater that got to a teammate (or a one-timer)', value: r => (r.humanPasses && r.humanPasses[0] ? r.humanPasses[1] / r.humanPasses[0] : NaN),
      show: r => (r.humanPasses && r.humanPasses[0] ? pct1(100 * r.humanPasses[1] / r.humanPasses[0]) : '–') },
    { key: 'goalie', label: 'Goalie time/GP', title: 'Time a person controlled the goalie, a game (real time)', value: r => r.habits.goalieSeconds / r.habitGames, show: r => mmss(r.habits.goalieSeconds / r.habitGames) },
    { key: 'dives', label: 'Dives/GP', value: r => r.habits.dives / r.habitGames, show: r => per(r.habits.dives, r.habitGames) },
  ], 'habitGames') : '<p class="empty">No controller recordings in these games.</p>';
  // Passing network of one team: the team picked above, else My team, else the one with the most games. A pass only
  // has a receiver when it reached one (a picked-off pass has no known target), so these are completed passes.
  const netTeam = rows.find(r => r.abbr === focus) || [...rows].sort((a, b) => b.gp - a.gp)[0];
  const pairs = Object.entries(netTeam.pairs).map(([k, v]) => ({ k, made: v[1], shots: v[2] })).filter(p => p.made || p.shots);
  const network = table('playPairs', pairs, [
    { key: 'k', label: 'Passer \u2192 receiver', left: true, show: r => esc(r.k) },
    { key: 'made', label: 'Passes completed' },
    { key: 'shots', label: 'Shot attempts off them', title: 'Shot assists: the receiver\u2019s attempts straight off the pass' },
    { key: 'rate', label: '\u2192 shot', title: 'Share of these passes that led straight to a shot attempt', value: r => (r.made ? r.shots / r.made : NaN),
      show: r => (r.made ? pct1(100 * r.shots / r.made) : '\u2013') },
  ], 'made');
  return '<h2>Play style</h2><h2 style="font-size:14px">How chances were made</h2>' + chances +
    '<h2 style="font-size:14px;margin-top:20px">Person vs computer</h2>' + versus +
    '<h2 style="font-size:14px;margin-top:20px">Controller habits</h2>' + habits +
    `<h2 style="font-size:14px;margin-top:20px">Passing network: ${esc(netTeam.name)} <small class="muted">(pick a team above to see another)</small></h2>` + network +
    '<p class="note">The person always has the puck carrier, so shots and passes are almost all the person\u2019s; checks and penalties are where the computer\u2019s skaters show.</p>';
}

// ---------------------------------------------------------------------------------------------------- goalie maps
// Where goalies get beaten: every attempt that reached a goalie (or his team), drawn on the half rink he defends,
// with goals and save percentage by type.
let gmWho = '';
function goalieShots(list, who) {
  // who: 'g:<abbr>|<name>' a goalie, 't:<abbr>' all of a team's goalies. Shots are [x, y, result, goalie, type, flags].
  const out = [];
  for (const g of list) g.abbr.forEach((abbr, side) => {
    const kind = who.slice(0, 2), key = who.slice(2), [team, name] = key.split('|');
    if (abbr !== team) return;
    const shooters = g.teams[1 - side].shotMap || [];
    const keeper = kind === 'g:' ? (g.players[side].find(p => p.goalie && p.name === name) || {}).idx : null;
    for (const s of shooters) if (kind === 't:' || s[3] === keeper) out.push(s);
  });
  return out;
}
function viewGoalieMap(list) {
  const goalies = [];
  for (const g of list) g.abbr.forEach((abbr, side) => {
    for (const p of g.players[side]) if (p.goalie && (p.sa || p.toi)) { const k = 'g:' + abbr + '|' + p.name; if (!goalies.some(x => x[0] === k)) goalies.push([k, p.name + ' (' + abbr + ')']); }
  });
  const teams = [...new Set(list.flatMap(g => g.abbr))].sort().map(a => ['t:' + a, 'All ' + a + ' goalies']);
  const options = [...goalies.sort((a, b) => a[1].localeCompare(b[1])), ...teams];
  if (!options.some(o => o[0] === gmWho)) gmWho = (options.find(o => o[0].startsWith('t:' + myTeam())) || options[0] || [''])[0];
  return `<h2 style="margin-top:24px">Where goalies get beaten</h2>
    <div class="filters" style="margin-bottom:12px"><label>Goalie <select id="gmWho">${options.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join('')}</select></label></div>
    <div class="heatwrap"><canvas id="gmCanvas" width="360" height="330" aria-label="Shots against"></canvas><div class="heatside" id="gmSide"></div></div>`;
}
const SHOT_TYPES = { 'wrist shot': 'Wrist shots', slapshot: 'Slapshots', 'one-timer': 'One-timers', deflection: 'Deflections', 'pass shot': 'Pass shots', other: 'Scrambles' };
async function drawGoalieMap(list) {
  const canvas = $('gmCanvas');
  if (!canvas) return;
  $('gmWho').value = gmWho;
  const shots = goalieShots(list, gmWho).filter(s => 'gsp'.includes(s[2]));  // ones that reached the goalie
  const system = list.every(g => g.system === 'snes') ? 'snes' : 'genesis', pic = RINK_PICS[system];
  const img = await rinkImage(system);
  if ($('gmCanvas') !== canvas) return;
  // The half rink he defends, shown with the net at the top (shots are kept attacking up).
  const ctx = canvas.getContext('2d'), scale = canvas.width / 900, top = pic.cy - 300 * pic.uy;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img) ctx.drawImage(img, 0, top - 10, 900, 300 * pic.uy + 20, 0, 0, canvas.width, (300 * pic.uy + 20) * scale);
  const at = (x, y) => [(pic.cx + x * pic.ux) * scale, (pic.cy - y * pic.uy - (top - 10)) * scale];
  for (const s of shots.filter(s => s[2] !== 'g')) {  // saves and posts first, goals on top
    const [px, py] = at(s[0], s[1]);
    ctx.beginPath(); ctx.arc(px, py, 4, 0, 2 * Math.PI); ctx.lineWidth = 1.6; ctx.strokeStyle = s[2] === 'p' ? '#f2c744' : '#1e242c'; ctx.stroke();
  }
  for (const s of shots.filter(s => s[2] === 'g')) {
    const [px, py] = at(s[0], s[1]);
    ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fillStyle = '#e5484d'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  }
  // Goals and save % by type, and in the slot (high danger), off rebounds, EA Specials, wraparounds
  const rowsFor = test => { const all = shots.filter(test), goals = all.filter(s => s[2] === 'g').length; return [all.length, goals]; };
  const lines = [['All shots', rowsFor(() => true)],
    ...Object.entries(SHOT_TYPES).map(([k, n]) => [n, rowsFor(s => s[4] === k)]),
    ['High danger (the slot)', rowsFor(s => s[5].includes('h'))], ['Rebounds', rowsFor(s => s[5].includes('r'))],
    ['EA Specials', rowsFor(s => s[5].includes('e'))], ['Wraparounds', rowsFor(s => s[5].includes('x'))]].filter(([, v]) => v[0]);
  $('gmSide').innerHTML = `<table><thead><tr><th class="left">Shots</th><th>Faced</th><th>Goals</th><th>SV%</th></tr></thead><tbody>` +
    lines.map(([n, v]) => `<tr><td class="left">${n}</td><td>${v[0]}</td><td>${v[1]}</td><td>${svp(v[0], v[1])}</td></tr>`).join('') + '</tbody></table>' +
    '<p class="note">Red: goals. Hollow: saves (yellow: off the post). Every shot that reached him, his net at the top.</p>';
}

function viewGames(list, team) {
  const excluded = excludedSet(), rows = pool(true, true).map(g => ({ ...g, off: excluded.has(g.name) }));
  return '<h2>Games</h2>' + table('games', rows, [
    { key: 'in', label: 'Count', sortable: false, show: r => `<input type="checkbox" data-game="${esc(r.name)}"${r.off ? '' : ' checked'} aria-label="Count this game">` },
    { key: 'date', label: 'When', left: true, show: r => esc((r.date || '').replace('T', ' ')) },
    { key: 'home', label: 'Home', left: true, value: r => r.names[0], show: r => esc(r.names[0]) + (r.humans[0] ? '' : '<span class="tag">CPU</span>') + (r.abbr[0] === myTeam() ? '<span class="tag you">you</span>' : '') },
    { key: 'score', label: 'Score', value: r => r.score[0] - r.score[1], show: r => `<b>${r.score[0]}–${r.score[1]}</b>${r.overtime ? ' <small>OT</small>' : ''}` },
    { key: 'away', label: 'Away', left: true, value: r => r.names[1], show: r => esc(r.names[1]) + (r.humans[1] ? '' : '<span class="tag">CPU</span>') + (r.abbr[1] === myTeam() ? '<span class="tag you">you</span>' : '') },
    { key: 'whole', label: '', sortable: false, show: r => (r.finished && r.fromStart ? '' : '<small>part of a game</small>') },
    { key: 'watch', label: '', sortable: false, show: r => `<a href="viewer.html?match=${encodeURIComponent(r.name)}">Watch</a>` },
  ], 'date') + `<p class="note">Untick a game to leave it out of every table${currentSeason() ? (canSave ? ' (saved with the season)' : ' (open this page from the helper to save it)') : ' (until the page is reloaded)'}.</p>`;
}

load().then(data => {
  if (!data) { $('sub').textContent = 'No season data found. Open this page from the helper (http://localhost:9494/season.html), or run python tools/season.py.'; return; }
  games = data.games || []; seasons = data.seasons || []; romTeams = data.romTeams || {}; romNames = data.romNames || {};
  if (!games.length && !canSave) { $('sub').textContent = 'No games yet. Play one with the helper running and it will appear here.'; return; }
  setup();
  render();
});
</script>
