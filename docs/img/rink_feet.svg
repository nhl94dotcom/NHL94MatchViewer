<text x='40.0' y='476.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Goal lines at 268 from centre; blue lines at 88; end-zone dots 70 across, 62 out from the goal line (21 ft); goalies stand</text>
<text x='40.0' y='493.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>about 20-25 out (7-8 ft, blue dots). Goal mouth 40 units wide (13 ft) on the Genesis; the SNES scores 34 wide, posts to 44.</text>
<text x='40.0' y='510.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>High danger (shot maps): within 60 of the net and 50 to either side. Shots can be exact within 200 of the aim point (67 ft).</text>
