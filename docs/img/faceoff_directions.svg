<svg xmlns='http://www.w3.org/2000/svg' width='860' height='550' viewBox='0 0 860 550' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>Faceoff directions</title>
<rect width='860' height='550' fill='#ffffff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<text x='430.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Which way a won faceoff sends the puck (Genesis)</text>
<text x='430.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>The winner attacks UP the page. Each arrow is the puck's speed and direction for the d-pad direction held, to scale.</text>
<circle cx='300.0' cy='270.0' r='6.0' fill='#c94040' fill-opacity='1' stroke='#c94040' stroke-width='1.5'/>
<circle cx='300.0' cy='270.0' r='140.8' fill='none' fill-opacity='1' stroke='#d9e2ec' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='300.0' y1='270.0' x2='300.0' y2='174.3' stroke='#3b82c4' stroke-width='3' marker-end='url(#arr)'/>
<text x='300.0' y='164.3' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>Up: 4,352</text>
<line x1='300.0' y1='270.0' x2='399.3' y2='215.8' stroke='#3b82c4' stroke-width='3' marker-end='url(#arr)'/>
<text x='413.3' y='205.8' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>Up-right: 5,141</text>
<line x1='300.0' y1='270.0' x2='440.8' y2='315.1' stroke='#3b82c4' stroke-width='3' marker-end='url(#arr)'/>
<text x='454.8' y='333.1' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>Right: 6,720</text>
<line x1='300.0' y1='270.0' x2='399.3' y2='414.3' stroke='#3f9d5c' stroke-width='3' marker-end='url(#arr)'/>
<text x='413.3' y='432.3' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>Down-right: 7,962</text>
<line x1='300.0' y1='270.0' x2='300.0' y2='455.9' stroke='#3f9d5c' stroke-width='3' marker-end='url(#arr)'/>
<text x='300.0' y='473.9' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>Down: 8,448</text>
<line x1='300.0' y1='270.0' x2='200.7' y2='414.3' stroke='#3f9d5c' stroke-width='3' marker-end='url(#arr)'/>
<text x='186.7' y='432.3' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal'>Down-left: 7,962</text>
<line x1='300.0' y1='270.0' x2='159.2' y2='315.1' stroke='#3b82c4' stroke-width='3' marker-end='url(#arr)'/>
<text x='145.2' y='333.1' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal'>Left: 6,720</text>
<line x1='300.0' y1='270.0' x2='200.7' y2='215.8' stroke='#3b82c4' stroke-width='3' marker-end='url(#arr)'/>
<text x='186.7' y='205.8' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal'>Up-left: 5,141</text>
<text x='300.0' y='520.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>(the dashed circle: the push without the 2,048 toward the winner's end)</text>
<text x='560.0' y='100.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>Every draw adds 2,048 toward the</text>
<text x='560.0' y='117.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>winner's own end:</text>
<text x='560.0' y='134.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>straight back is the fastest (8,448);</text>
<text x='560.0' y='151.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>sideways comes out angled back;</text>
<text x='560.0' y='168.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>straight forward is slow (4,352).</text>
<text x='560.0' y='185.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='560.0' y='202.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>Hold a direction (green or blue):</text>
<text x='560.0' y='219.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>if you win, the puck goes that way</text>
<text x='560.0' y='236.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>3 times in 4.</text>
<text x='560.0' y='253.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='560.0' y='270.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>Hold nothing (the computer never</text>
<text x='560.0' y='287.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>holds one): a random one of the five</text>
<text x='560.0' y='304.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>blue directions, from sideways to</text>
<text x='560.0' y='321.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>straight at the other team.</text>
<text x='560.0' y='338.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='560.0' y='355.0' font-size='12' fill='#3f9d5c' text-anchor='start' font-weight='bold'>Best: straight back to your defence.</text>
</svg>
