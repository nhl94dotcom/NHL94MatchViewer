<svg xmlns='http://www.w3.org/2000/svg' width='820' height='470' viewBox='0 0 820 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>Rocket pass</title>
<rect width='820' height='470' fill='#ffffff'/>
<text x='410.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>The rocket pass (Genesis): the travel time is rounded down</text>
<text x='410.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>The game times a pass to meet the receiver in whole eighths of a second, rounded down, then sends it fast enough to get there.</text>
