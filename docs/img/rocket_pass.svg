<text x='625.0' y='84.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>Where it bites:</text>
<text x='625.0' y='101.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>a meeting just over an eighth</text>
<text x='625.0' y='118.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>of a second away (28-55 units)</text>
<text x='625.0' y='135.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>is timed as one eighth, so the</text>
<text x='625.0' y='152.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>pass goes up to twice as fast.</text>
<text x='625.0' y='169.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='625.0' y='186.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>That's a receiver skating</text>
<text x='625.0' y='203.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>toward you from about 50-70</text>
<text x='625.0' y='220.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>units (17-23 ft) away.</text>
<text x='625.0' y='237.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='625.0' y='254.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Longer passes are off by less</text>
<text x='625.0' y='271.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>(at most 1/8 s of 2, 3, 4 ...).</text>
<text x='625.0' y='288.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='625.0' y='305.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Recorded: 24 of 718 person</text>
<text x='625.0' y='322.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>passes over 25,000.</text>
<text x='110.0' y='424.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>The SNES sets a pass's speed from the distance instead, so it has no rocket pass.</text>
</svg>
