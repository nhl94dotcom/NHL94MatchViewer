<text x='410.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Faceoffs (Genesis): it's where your swing is at the drop</text>
<text x='410.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>Each new B press swings the stick once (18 frames, 0.3 s). Holding B does nothing. Ratings play no part.</text>
