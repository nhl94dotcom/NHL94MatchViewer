<text x='410.0' y='394.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>52%</text>
<text x='60.0' y='424.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>The drop picture changes only 9-17 frames before the drop: too late to time one swing.</text>
<text x='60.0' y='442.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>So mash: the faster the presses come, the more time you spend in the middle and the sweep.</text>
<text x='60.0' y='460.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Hold the d-pad toward a teammate: a win sends the puck that way 3 times in 4.</text>
