<text x='608.0' y='252.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>the sweep: worth 16</text>
<text x='60.0' y='284.0' font-size='13' fill='#1f2933' text-anchor='start' font-weight='bold'>At the drop (3-5 s after the box appears, at random), the game compares the two centres' values:</text>
<text x='60.0' y='304.0' font-size='13' fill='#1f2933' text-anchor='start' font-weight='normal'>Home wins with chance (17 + home - away) / 33, so the home team has a 17-in-33 edge at equal timing.</text>
