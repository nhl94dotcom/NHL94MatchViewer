<title>Shot scatter</title>
<rect width='820' height='470' fill='#ffffff'/>
<text x='410.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Shot scatter (Genesis): how far off target a shot can go</text>
<text x='410.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>Most the shot can miss its aim point to either side, by distance from the aim point and working Shot Accuracy.</text>
