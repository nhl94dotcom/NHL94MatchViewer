<text x='590.0' y='240.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Working value = 5 x rating + hot / cold.</text>
<text x='590.0' y='256.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>A shot that isn't exact misses its aim</text>
<text x='590.0' y='272.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>by a random amount up to the line,</text>
<text x='590.0' y='288.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>left or right; along the net by less;</text>
<text x='590.0' y='304.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>and upward only, by up to half of it.</text>
<text x='590.0' y='320.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='590.0' y='336.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Beyond 200 (about 67 ft) no shot is</text>
<text x='590.0' y='352.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>exact, and beyond 250 the error</text>
<text x='590.0' y='368.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>doubles (to at most 136): from the blue</text>
<text x='590.0' y='384.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>line even good shooters spray it.</text>
