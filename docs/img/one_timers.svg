<svg xmlns='http://www.w3.org/2000/svg' width='860' height='604' viewBox='0 0 860 604' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>One-timers</title>
<rect width='860' height='604' fill='#ffffff'/>
<text x='430.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>One-timers: when to press, and what makes them go in</text>
<text x='430.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>Press shoot while the pass is on its way; the game times the downswing itself and waits up to 0.8 s at full wind-up.</text>
<text x='60.0' y='82.0' font-size='13' fill='#1f2933' text-anchor='start' font-weight='bold'>Time from the press (recorded)</text>
<line x1='170.0' y1='90.0' x2='170.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='170.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.0 s</text>
<line x1='233.0' y1='90.0' x2='233.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='233.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.1 s</text>
<line x1='296.0' y1='90.0' x2='296.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='296.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.2 s</text>
<line x1='359.0' y1='90.0' x2='359.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='359.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.3 s</text>
<line x1='422.0' y1='90.0' x2='422.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='422.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.4 s</text>
<line x1='485.0' y1='90.0' x2='485.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='485.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.5 s</text>
<line x1='548.0' y1='90.0' x2='548.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='548.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.6 s</text>
<line x1='611.0' y1='90.0' x2='611.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='611.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.7 s</text>
<line x1='674.0' y1='90.0' x2='674.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='674.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.8 s</text>
<line x1='737.0' y1='90.0' x2='737.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='737.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>0.9 s</text>
<line x1='800.0' y1='90.0' x2='800.0' y2='240.0' stroke='#d9e2ec' stroke-width='1' />
<text x='800.0' y='256.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>1.0 s</text>
<text x='160.0' y='116.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Genesis: struck</text>
<rect x='170.0' y='102' width='548.1' height='20' rx='4' fill='#3f9d5c' fill-opacity='0.3' stroke='#3f9d5c'/>
<line x1='302.3' y1='99.0' x2='302.3' y2='125.0' stroke='#3f9d5c' stroke-width='3' />
<text x='307.3' y='116.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>median 210 ms</text>
<text x='160.0' y='150.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Genesis: failed swing over</text>
<rect x='359.0' y='136' width='415.79999999999995' height='20' rx='4' fill='#c94040' fill-opacity='0.3' stroke='#c94040'/>
<line x1='538.5' y1='133.0' x2='538.5' y2='159.0' stroke='#c94040' stroke-width='3' />
<text x='543.5' y='150.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>median 585 ms</text>
<text x='160.0' y='184.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>SNES: struck</text>
<rect x='170.0' y='170' width='371.70000000000005' height='20' rx='4' fill='#3f9d5c' fill-opacity='0.3' stroke='#3f9d5c'/>
<line x1='295.4' y1='167.0' x2='295.4' y2='193.0' stroke='#3f9d5c' stroke-width='3' />
<text x='300.4' y='184.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>median 199 ms</text>
<text x='160.0' y='218.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>SNES: failed swing over</text>
<line x1='462.9' y1='201.0' x2='462.9' y2='227.0' stroke='#c94040' stroke-width='3' />
<text x='467.9' y='218.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>median 465 ms (range not kept)</text>
<text x='60.0' y='280.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>So: press no more than about 0.9 s (Genesis) or 0.6 s (SNES) before the puck reaches him; pressing as it arrives strikes at once.</text>
<text x='60.0' y='320.0' font-size='13' fill='#1f2933' text-anchor='start' font-weight='bold'>What made Genesis one-timers score (91 recorded)</text>
<text x='60.0' y='346.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>Goalie off the puck's line at the strike</text>
<rect x='70' y='490.2' width='46' height='19.8' fill='#3b82c4' fill-opacity='0.8'/>
<text x='93.0' y='484.2' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>11%</text>
<text x='93.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>0-4 units</text>
<text x='93.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>28 shots</text>
<rect x='140' y='477.6' width='46' height='32.4' fill='#3b82c4' fill-opacity='0.8'/>
<text x='163.0' y='471.6' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>18%</text>
<text x='163.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>4-10</text>
<text x='163.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>38 shots</text>
<rect x='210' y='387.6' width='46' height='122.4' fill='#3f9d5c' fill-opacity='0.8'/>
<text x='233.0' y='381.6' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>68%</text>
<text x='233.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>10+</text>
<text x='233.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>25 shots</text>
<line x1='60.0' y1='510.0' x2='280.0' y2='510.0' stroke='#52606d' stroke-width='1' />
<text x='320.0' y='346.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>How far the pass moved the puck across</text>
<rect x='330' y='475.8' width='46' height='34.2' fill='#3b82c4' fill-opacity='0.8'/>
<text x='353.0' y='469.8' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>19%</text>
<text x='353.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>0-40</text>
<text x='353.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>32 shots</text>
<rect x='400' y='425.4' width='46' height='84.60000000000001' fill='#3f9d5c' fill-opacity='0.8'/>
<text x='423.0' y='419.4' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>47%</text>
<text x='423.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>40-90</text>
<text x='423.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>34 shots</text>
<rect x='470' y='474.0' width='46' height='36.0' fill='#3b82c4' fill-opacity='0.8'/>
<text x='493.0' y='468.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>20%</text>
<text x='493.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>90+</text>
<text x='493.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>25 shots</text>
<line x1='320.0' y1='510.0' x2='540.0' y2='510.0' stroke='#52606d' stroke-width='1' />
<text x='580.0' y='346.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>Distance from the net at the strike</text>
<rect x='590' y='430.8' width='46' height='79.2' fill='#3f9d5c' fill-opacity='0.8'/>
<text x='613.0' y='424.8' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>44%</text>
<text x='613.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>under 60</text>
<text x='613.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>18 shots</text>
<rect x='660' y='430.8' width='46' height='79.2' fill='#3f9d5c' fill-opacity='0.8'/>
<text x='683.0' y='424.8' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>44%</text>
<text x='683.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>60-100</text>
<text x='683.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>34 shots</text>
<rect x='730' y='492.0' width='46' height='18.0' fill='#3b82c4' fill-opacity='0.8'/>
<text x='753.0' y='486.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>10%</text>
<text x='753.0' y='525.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>100+</text>
<text x='753.0' y='539.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>39 shots</text>
<line x1='580.0' y1='510.0' x2='800.0' y2='510.0' stroke='#52606d' stroke-width='1' />
<text x='60.0' y='568.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Quick passes (under 0.5 s in the air) that move the puck 40-90 across catch the computer goalie off his line; long cross-ice</text>
<text x='60.0' y='584.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>passes give him time to slide over. On the SNES (55 recorded) only distance showed: 8 of 25 from 60-100 units, none from elsewhere.</text>
</svg>
