<svg xmlns='http://www.w3.org/2000/svg' width='860' height='570.0' viewBox='0 0 860 570.0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>Computer defence</title>
<rect width='860' height='570.0' fill='#ffffff'/>
<text x='430.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Where computer skaters go on defence (Genesis), by where the puck is</text>
<text x='430.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>The defending team's own net is at the BOTTOM. Hollow marks: the attacking carrier (puck) and their deepest player.</text>
