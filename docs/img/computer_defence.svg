<text x='80.0' y='234.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>LW</text>
<line x1='188.0' y1='230.0' x2='212.0' y2='214.0' stroke='#3f9d5c' stroke-width='1.5' />
<circle cx='212.0' cy='214.0' r='10.0' fill='#3f9d5c' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='212.0' y='218.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>RW</text>
<circle cx='174.0' cy='267.0' r='10.0' fill='#e8833a' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='174.0' y='271.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>C</text>
<circle cx='188.0' cy='230.0' r='8.0' fill='#ffffff' fill-opacity='1' stroke='#1f2933' stroke-width='2.5'/>
<circle cx='188.0' cy='230.0' r='3.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='156.0' cy='260.0' r='8.0' fill='#ffffff' fill-opacity='1' stroke='#c94040' stroke-width='2.5'/>
<rect x='326.0' y='90.0' width='208.0' height='300.0' rx='15.0' fill='#f7fbff' stroke='#52606d' stroke-width='1.5'/>
<line x1='326.0' y1='196.0' x2='534.0' y2='196.0' stroke='#3b82c4' stroke-width='3' />
<line x1='326.0' y1='284.0' x2='534.0' y2='284.0' stroke='#3b82c4' stroke-width='3' />
<line x1='326.0' y1='240.0' x2='534.0' y2='240.0' stroke='#c94040' stroke-width='2' />
<line x1='326.0' y1='106.0' x2='534.0' y2='106.0' stroke='#c94040' stroke-width='1.5' />
<line x1='326.0' y1='374.0' x2='534.0' y2='374.0' stroke='#c94040' stroke-width='1.5' />
<rect x='414.0' y='374.0' width='32.0' height='8' fill='#ffffff' stroke='#1f2933'/>
<text x='430.0' y='78.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>Puck in his zone</text>
<circle cx='430.0' cy='342.5' r='10.0' fill='#3b82c4' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='430.0' y='346.5' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>LD</text>
<circle cx='482.0' cy='342.5' r='10.0' fill='#3b82c4' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='482.0' y='346.5' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>RD</text>
<circle cx='350.0' cy='319.0' r='10.0' fill='#3f9d5c' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='350.0' y='323.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>LW</text>
<line x1='478.0' y1='330.0' x2='502.0' y2='314.0' stroke='#3f9d5c' stroke-width='1.5' />
<circle cx='502.0' cy='314.0' r='10.0' fill='#3f9d5c' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='502.0' y='318.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>RW</text>
<circle cx='454.0' cy='304.0' r='10.0' fill='#e8833a' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='454.0' y='308.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>C</text>
<circle cx='478.0' cy='330.0' r='8.0' fill='#ffffff' fill-opacity='1' stroke='#1f2933' stroke-width='2.5'/>
<circle cx='478.0' cy='330.0' r='3.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='446.0' cy='355.0' r='8.0' fill='#ffffff' fill-opacity='1' stroke='#c94040' stroke-width='2.5'/>
<rect x='596.0' y='90.0' width='208.0' height='300.0' rx='15.0' fill='#f7fbff' stroke='#52606d' stroke-width='1.5'/>
<line x1='596.0' y1='196.0' x2='804.0' y2='196.0' stroke='#3b82c4' stroke-width='3' />
<line x1='596.0' y1='284.0' x2='804.0' y2='284.0' stroke='#3b82c4' stroke-width='3' />
<line x1='596.0' y1='240.0' x2='804.0' y2='240.0' stroke='#c94040' stroke-width='2' />
<line x1='596.0' y1='106.0' x2='804.0' y2='106.0' stroke='#c94040' stroke-width='1.5' />
<line x1='596.0' y1='374.0' x2='804.0' y2='374.0' stroke='#c94040' stroke-width='1.5' />
<rect x='684.0' y='374.0' width='32.0' height='8' fill='#ffffff' stroke='#1f2933'/>
<text x='700.0' y='78.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>Puck behind his net</text>
<circle cx='648.0' cy='342.5' r='10.0' fill='#3b82c4' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='648.0' y='346.5' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>LD</text>
<circle cx='700.0' cy='342.5' r='10.0' fill='#3b82c4' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='700.0' y='346.5' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>RD</text>
<line x1='676.0' y1='382.5' x2='700.0' y2='366.5' stroke='#3f9d5c' stroke-width='1.5' />
<circle cx='700.0' cy='366.5' r='10.0' fill='#3f9d5c' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='700.0' y='370.5' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>LW</text>
<circle cx='780.0' cy='374.0' r='10.0' fill='#3f9d5c' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='780.0' y='378.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>RW</text>
<circle cx='688.0' cy='304.0' r='10.0' fill='#e8833a' fill-opacity='0.9' stroke='#ffffff' stroke-width='1.5'/>
<text x='688.0' y='308.0' font-size='9' fill='#ffffff' text-anchor='middle' font-weight='bold'>C</text>
<circle cx='676.0' cy='382.5' r='8.0' fill='#ffffff' fill-opacity='1' stroke='#1f2933' stroke-width='2.5'/>
<circle cx='676.0' cy='382.5' r='3.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='70.0' cy='426.0' r='7.0' fill='#3b82c4' fill-opacity='1' stroke='#ffffff' stroke-width='1.5'/>
<text x='84.0' y='430.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>defencemen: 50 behind the deepest attacker (no deeper than ~205); the one away from the puck moves to the middle</text>
<circle cx='70.0' cy='446.0' r='7.0' fill='#3f9d5c' fill-opacity='1' stroke='#ffffff' stroke-width='1.5'/>
<text x='84.0' y='450.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>wingers: level with the puck (on the puck's side: right on the carrier); at 158 in the zone; at the goal line behind it</text>
<circle cx='70.0' cy='466.0' r='7.0' fill='#e8833a' fill-opacity='1' stroke='#ffffff' stroke-width='1.5'/>
<text x='84.0' y='470.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>centre: halfway between the puck and the high slot (128 out); in the slot once the puck is in the zone</text>
<circle cx='70.0' cy='486.0' r='7.0' fill='#ffffff' fill-opacity='1' stroke='#1f2933' stroke-width='2'/>
<text x='84.0' y='490.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>the attacking carrier</text>
<circle cx='290.0' cy='486.0' r='7.0' fill='#ffffff' fill-opacity='1' stroke='#c94040' stroke-width='2'/>
<text x='304.0' y='490.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>their deepest player (sets the defencemen's depth)</text>
<text x='60.0' y='524.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>One skater, whoever is nearest, chases the carrier instead (assnearest); the defencemen re-read the deepest attacker only at</text>
<text x='60.0' y='541.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>their Defensive Awareness ticks (7-15 frames), so a quick step-out and back in leaves them where they were.</text>
</svg>
