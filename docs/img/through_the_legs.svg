<svg xmlns='http://www.w3.org/2000/svg' width='880' height='856' viewBox='0 0 880 856' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>Through the legs</title>
<rect width='880' height='856' fill='#ffffff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<text x='360.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Through the legs: the butterfly's blind ring (Genesis)</text>
<text x='360.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>Seen from above, to scale. The goalie faces down the page; his net is above him.</text>
<line x1='44.0' y1='102.0' x2='616.0' y2='102.0' stroke='#c94040' stroke-width='3' />
<text x='48.0' y='94.0' font-size='12' fill='#c94040' text-anchor='start' font-weight='normal'>goal line (net behind)</text>
<circle cx='110.0' cy='102.0' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='550.0' cy='102.0' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='300.0' r='143.0' fill='#cfe3f5' fill-opacity='1' stroke='#3b82c4' stroke-width='2'/>
<path fill='#e8833a' fill-opacity='0.55' fill-rule='evenodd' stroke='#e8833a' stroke-width='1.5' d='M297,325.3 a154,154 0 1,0 308,0 a154,154 0 1,0 -308,0 z M363,325.3 a88,88 0 1,0 176,0 a88,88 0 1,0 -176,0 z'/>
<circle cx='451.0' cy='325.3' r='88.0' fill='#3f9d5c' fill-opacity='0.35' stroke='#3f9d5c' stroke-width='1.5'/>
<rect x='444' y='321.3' width='14' height='8' fill='#1f2933'/>
<text x='451.0' y='345.3' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>blade</text>
<line x1='323.0' y1='293.0' x2='337.0' y2='307.0' stroke='#1f2933' stroke-width='2.5' />
<line x1='323.0' y1='307.0' x2='337.0' y2='293.0' stroke='#1f2933' stroke-width='2.5' />
<text x='318.0' y='290.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='bold'>his centre</text>
<line x1='330.0' y1='713.2' x2='330.0' y2='223.0' stroke='#1f2933' stroke-width='1.5' stroke-dasharray='4 3' />
<circle cx='330.0' cy='691.2' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='630.3' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='569.3' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='508.4' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='447.4' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='386.4' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='325.5' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='264.5' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<circle cx='330.0' cy='203.6' r='5.0' fill='#c94040' fill-opacity='1' stroke='#c94040' stroke-width='1.5'/>
<line x1='330.0' y1='192.6' x2='330.0' y2='118.5' stroke='#c94040' stroke-width='2.5' marker-end='url(#arr)'/>
<line x1='352.0' y1='432.0' x2='592.0' y2='432.0' stroke='#52606d' stroke-width='1' stroke-dasharray='2 3' />
<text x='600.0' y='436.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>1. Front strip: about 2 units of body</text>
<text x='600.0' y='451.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>test before the ring begins. A fast puck</text>
<text x='600.0' y='466.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>(3-7 units a frame) often steps over it.</text>
<line x1='352.0' y1='322.0' x2='592.0' y2='322.0' stroke='#52606d' stroke-width='1' stroke-dasharray='2 3' />
<text x='600.0' y='326.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>2. Blind ring (8-14 from the blade):</text>
<text x='600.0' y='341.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>the stick doesn't play the puck, and the</text>
<text x='600.0' y='356.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>body test is skipped. It slides through.</text>
<line x1='352.0' y1='190.0' x2='592.0' y2='190.0' stroke='#52606d' stroke-width='1' stroke-dasharray='2 3' />
<text x='600.0' y='194.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>3. Out of the ring behind his centre:</text>
<text x='600.0' y='209.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>the body test hits, and the bounce goes</text>
<text x='600.0' y='224.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>out from his centre: back, into the net.</text>
<rect x='70' y='729' width='26' height='13' fill='#cfe3f5' fill-opacity='0.6' stroke='#3b82c4'/>
<text x='106.0' y='740.0' font-size='13' fill='#1f2933' text-anchor='start' font-weight='normal'>body circle (reach 13 here; 12-15 by Agility)</text>
<rect x='70' y='749' width='26' height='13' fill='#3f9d5c' fill-opacity='0.6' stroke='#3f9d5c'/>
<text x='106.0' y='760.0' font-size='13' fill='#1f2933' text-anchor='start' font-weight='normal'>within 8 of the blade: the stick plays a low puck</text>
<rect x='70' y='769' width='26' height='13' fill='#e8833a' fill-opacity='0.6' stroke='#e8833a'/>
<text x='106.0' y='780.0' font-size='13' fill='#1f2933' text-anchor='start' font-weight='normal'>8-14 from the blade: nothing is tested at all</text>
<text x='70.0' y='806.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Only a puck at height 5 or less that isn't rising meets the stick at all; lifted pucks get the body test as usual.</text>
<text x='70.0' y='822.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Standing, his blade is in front of his middle, so the ring doesn't cover it. Dots: the puck once a frame at 22,700 (about 77 mph):</text>
<text x='70.0' y='838.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>black untouched, white inside the blind ring, red the body hit. Recorded: three goals like this in the ANA-ATL 2-on-2 game.</text>
</svg>
