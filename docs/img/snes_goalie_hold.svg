<text x='610.0' y='329.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>A puck he doesn't hold bounces</text>
<text x='610.0' y='346.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>off at the speed of where it hit</text>
<text x='610.0' y='363.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>him: shoot hard for rebounds.</text>
<text x='90.0' y='424.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Slower than 8,192 across and along, he always holds it (when he can); faster than 8,192 plus his range, never.</text>
