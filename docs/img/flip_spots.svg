<svg xmlns='http://www.w3.org/2000/svg' width='860' height='474.0' viewBox='0 0 860 474.0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>The flip</title>
<rect width='860' height='474.0' fill='#ffffff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<text x='430.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Where the flip lands (Genesis: A with the puck)</text>
<text x='430.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>The team attacks UP. The d-pad doesn't aim it: the spot comes from where the passer is and which way he faces.</text>
<rect x='133.0' y='80.0' width='234.0' height='324.0' fill='#f7fbff' stroke='#1f2933' stroke-width='1.5'/>
<line x1='133.0' y1='270.8' x2='367.0' y2='270.8' stroke='#3b82c4' stroke-width='3' />
<line x1='133.0' y1='350.0' x2='367.0' y2='350.0' stroke='#c94040' stroke-width='2' />
<line x1='133.0' y1='108.8' x2='367.0' y2='108.8' stroke='#c94040' stroke-width='1.5' />
<rect x='232.0' y='95.79999999999998' width='36.0' height='13' fill='#ffffff' stroke='#1f2933'/>
<rect x='137.5' y='270.8' width='45.0' height='79.2' fill='#c94040' fill-opacity='0.18' stroke='#c94040' stroke-dasharray='4 3'/>
<rect x='317.5' y='270.8' width='45.0' height='79.2' fill='#c94040' fill-opacity='0.18' stroke='#c94040' stroke-dasharray='4 3'/>
<rect x='200.5' y='80.0' width='99.0' height='66.60000000000001' fill='#3f9d5c' fill-opacity='0.12' stroke='#3f9d5c' stroke-dasharray='4 3'/>
<rect x='145.59999999999997' y='167.29999999999998' width='8.1' height='8.1' fill='#3b82c4' stroke='#3b82c4'/>
<rect x='354.4' y='167.29999999999998' width='8.1' height='8.1' fill='#3b82c4' stroke='#3b82c4'/>
<rect x='245.5' y='187.99999999999997' width='8.1' height='8.1' fill='#e8833a' stroke='#e8833a'/>
<rect x='250.0' y='108.8' width='8.1' height='8.1' fill='#3f9d5c' stroke='#3f9d5c'/>
<circle cx='214.0' cy='323.0' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#3b82c4' stroke-width='2'/>
<path d='M214.0,323.0 Q179.8,145.4 145.6,175.4' fill='none' stroke='#3b82c4' stroke-width='2' stroke-dasharray='5 3' marker-end='url(#arr)'/>
<circle cx='304.0' cy='368.0' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#3b82c4' stroke-width='2'/>
<path d='M304.0,368.0 Q329.2,145.4 354.4,175.4' fill='none' stroke='#3b82c4' stroke-width='2' stroke-dasharray='5 3' marker-end='url(#arr)'/>
<circle cx='232.0' cy='224.0' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#e8833a' stroke-width='2'/>
<path d='M232.0,224.0 Q238.8,166.1 245.5,196.1' fill='none' stroke='#e8833a' stroke-width='2' stroke-dasharray='5 3' marker-end='url(#arr)'/>
<circle cx='259.0' cy='93.5' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#3f9d5c' stroke-width='2'/>
<path d='M259.0,93.5 Q254.5,63.5 250.0,116.9' fill='none' stroke='#3f9d5c' stroke-width='2' stroke-dasharray='5 3' marker-end='url(#arr)'/>
<circle cx='164.5' cy='314.0' r='5.0' fill='#ffffff' fill-opacity='1' stroke='#c94040' stroke-width='2'/>
<path d='M164.5,314.0 Q137.5,275.0 110.5,305.0' fill='none' stroke='#c94040' stroke-width='2' stroke-dasharray='5 3' marker-end='url(#arr)'/>
<text x='520.0' y='100.0' font-size='12' fill='#3b82c4' text-anchor='start' font-weight='bold'>Outside the attacking zone</text>
<text x='520.0' y='117.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>to the faceoff circle on the side he</text>
<text x='520.0' y='134.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>faces (straight ahead: his right),</text>
<text x='520.0' y='151.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>lofted high, over everyone's sticks.</text>
<text x='520.0' y='168.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='185.0' font-size='12' fill='#e8833a' text-anchor='start' font-weight='bold'>Inside the attacking zone</text>
<text x='520.0' y='202.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>to the high slot, lofted low.</text>
<text x='520.0' y='219.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='236.0' font-size='12' fill='#3f9d5c' text-anchor='start' font-weight='bold'>Deep, near the middle (green box)</text>
<text x='520.0' y='253.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>to the goal mouth.</text>
<text x='520.0' y='270.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='287.0' font-size='12' fill='#c94040' text-anchor='start' font-weight='bold'>Over the glass (red strips)</text>
<text x='520.0' y='304.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Closer to him than 60 sideways, the</text>
<text x='520.0' y='321.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>spot is moved to 60 from him: from</text>
<text x='520.0' y='338.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>75-125 out, facing the near boards,</text>
<text x='520.0' y='355.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>that's past the boards. Whistle.</text>
<text x='520.0' y='372.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='389.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Each spot gets 0-9 added at random;</text>
<text x='520.0' y='406.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>9 of 13 recorded lofted flips came</text>
<text x='520.0' y='423.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>down within 12 of it.</text>
<text x='60.0' y='440.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Circles: where each example passer stands. Squares: the landing spots (with their random range).</text>
<text x='60.0' y='457.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>The SNES flip (Y) is a computer-run dump-in aimed by his side of centre instead (SNES_MECHANICS 6.3).</text>
</svg>
