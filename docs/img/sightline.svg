<svg xmlns='http://www.w3.org/2000/svg' width='860' height='480' viewBox='0 0 860 480' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>One-timer sightline</title>
<rect width='860' height='480' fill='#ffffff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<text x='430.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>How the game aims a one-timer (Genesis): the sightline through the goalie</text>
<text x='430.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>A line from the puck through the goalie, carried on toward the net. Seen from above, to scale.</text>
<text x='215.0' y='82.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='bold'>Goalie in position</text>
<line x1='20.0' y1='146.6' x2='410.0' y2='146.6' stroke='#c94040' stroke-width='2.5' />
<text x='20.0' y='160.6' font-size='10' fill='#c94040' text-anchor='start' font-weight='normal'>goal line</text>
<rect x='124.0' y='120.6' width='104.0' height='26.0' fill='#f3f5f7' stroke='#1f2933'/>
<rect x='118.8' y='143.6' width='114.4' height='6' fill='#3f9d5c' fill-opacity='0.25'/>
<circle cx='176.0' cy='146.6' r='4.0' fill='#3f9d5c' fill-opacity='1' stroke='#3f9d5c' stroke-width='1.5'/>
<line x1='358.0' y1='391.0' x2='138.3' y2='125.8' stroke='#3b82c4' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#arr)'/>
<circle cx='207.2' cy='209.0' r='33.8' fill='#cfe3f5' fill-opacity='1' stroke='#3b82c4' stroke-width='2'/>
<text x='207.2' y='213.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>G</text>
<circle cx='358.0' cy='391.0' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<text x='348.0' y='395.0' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal'>puck (the one-timer)</text>
<line x1='176.0' y1='146.6' x2='163.8' y2='156.7' stroke='#1f2933' stroke-width='1.2' />
<text x='176.0' y='112.6' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>the net's middle: 6 from the line</text>
<text x='215.0' y='428.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>within 22: he's between puck and net</text>
<text x='215.0' y='446.0' font-size='13' fill='#3b82c4' text-anchor='middle' font-weight='bold'>aim just inside the post away from him</text>
<text x='645.0' y='82.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='bold'>Goalie wandered out to the side</text>
<line x1='450.0' y1='146.6' x2='840.0' y2='146.6' stroke='#c94040' stroke-width='2.5' />
<text x='450.0' y='160.6' font-size='10' fill='#c94040' text-anchor='start' font-weight='normal'>goal line</text>
<rect x='554.0' y='120.6' width='104.0' height='26.0' fill='#f3f5f7' stroke='#1f2933'/>
<rect x='548.8' y='143.6' width='114.4' height='6' fill='#3f9d5c' fill-opacity='0.25'/>
<circle cx='606.0' cy='146.6' r='4.0' fill='#3f9d5c' fill-opacity='1' stroke='#3f9d5c' stroke-width='1.5'/>
<line x1='788.0' y1='391.0' x2='717.0' y2='125.8' stroke='#e8833a' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#arr)'/>
<circle cx='749.0' cy='245.4' r='33.8' fill='#cfe3f5' fill-opacity='1' stroke='#3b82c4' stroke-width='2'/>
<text x='749.0' y='249.4' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>G</text>
<circle cx='788.0' cy='391.0' r='5.0' fill='#1f2933' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
<text x='778.0' y='395.0' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal'>puck (the one-timer)</text>
<line x1='606.0' y1='146.6' x2='714.7' y2='117.5' stroke='#1f2933' stroke-width='1.2' />
<text x='606.0' y='112.6' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal'>the net's middle: 43 from the line</text>
<text x='645.0' y='428.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>more than 22: the line misses the net</text>
<text x='645.0' y='446.0' font-size='13' fill='#c94040' text-anchor='middle' font-weight='bold'>aim HIGH MIDDLE, just under the bar</text>
<text x='430.0' y='472.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>Green band: within 22 of the middle (the posts are 20 out). The goalie's spot is where he's about to be: his position plus half the high byte of his speed.</text>
</svg>
