<text x='60.0' y='486.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>A skater switches to his defensive job when the other team gets the puck, at his next awareness tick (7-15 frames).</text>
<text x='60.0' y='503.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>The box is re-picked when the puck changes zone (or 1 tick in 128), so forwards drift to new spots as play moves.</text>
