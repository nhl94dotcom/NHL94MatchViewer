<text x='391.2' y='378.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>+16</text>
<line x1='447.5' y1='80.0' x2='447.5' y2='360.0' stroke='#d9e2ec' stroke-width='1' />
<text x='447.5' y='378.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>+32</text>
<line x1='503.8' y1='80.0' x2='503.8' y2='360.0' stroke='#d9e2ec' stroke-width='1' />
<text x='503.8' y='378.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>+48</text>
<line x1='560.0' y1='80.0' x2='560.0' y2='360.0' stroke='#d9e2ec' stroke-width='1' />
<text x='560.0' y='378.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>+64</text>
<line x1='110.0' y1='360.0' x2='560.0' y2='360.0' stroke='#d9e2ec' stroke-width='1' />
<text x='102.0' y='364.0' font-size='11' fill='#52606d' text-anchor='end' font-weight='normal'>0</text>
<line x1='110.0' y1='316.9' x2='560.0' y2='316.9' stroke='#d9e2ec' stroke-width='1' />
<text x='102.0' y='320.9' font-size='11' fill='#52606d' text-anchor='end' font-weight='normal'>20</text>
<line x1='110.0' y1='273.8' x2='560.0' y2='273.8' stroke='#d9e2ec' stroke-width='1' />
<text x='102.0' y='277.8' font-size='11' fill='#52606d' text-anchor='end' font-weight='normal'>40</text>
<line x1='110.0' y1='230.8' x2='560.0' y2='230.8' stroke='#d9e2ec' stroke-width='1' />
<text x='102.0' y='234.8' font-size='11' fill='#52606d' text-anchor='end' font-weight='normal'>60</text>
<line x1='110.0' y1='187.7' x2='560.0' y2='187.7' stroke='#d9e2ec' stroke-width='1' />
<text x='102.0' y='191.7' font-size='11' fill='#52606d' text-anchor='end' font-weight='normal'>80</text>
<line x1='110.0' y1='144.6' x2='560.0' y2='144.6' stroke='#d9e2ec' stroke-width='1' />
<text x='102.0' y='148.6' font-size='11' fill='#52606d' text-anchor='end' font-weight='normal'>100</text>
<line x1='110.0' y1='101.5' x2='560.0' y2='101.5' stroke='#d9e2ec' stroke-width='1' />
<text x='102.0' y='105.5' font-size='11' fill='#52606d' text-anchor='end' font-weight='normal'>120</text>
<text x='335.0' y='400.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='normal'>target's weight minus the checker's (lb; one rating step = 8 lb)</text>
<text x='58' y='220.0' font-size='12' fill='#1f2933' text-anchor='middle' transform='rotate(-90 58 220.0)'>knockdown number (lower = easier)</text>
<line x1='335.0' y1='80.0' x2='335.0' y2='360.0' stroke='#52606d' stroke-width='1' stroke-dasharray='3 3' />
