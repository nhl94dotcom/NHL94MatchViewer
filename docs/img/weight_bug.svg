<text x='408.1' y='278.2' font-size='11' fill='#c94040' text-anchor='start' font-weight='normal'>16+ lb heavier: near 0</text>
<text x='115.6' y='192.5' font-size='12' fill='#c94040' text-anchor='start' font-weight='bold'>a person's checker</text>
<text x='121.3' y='321.7' font-size='12' fill='#3b82c4' text-anchor='start' font-weight='bold'>computer checker (and the CB check)</text>
<text x='397.2' y='96.9' font-size='11' fill='#c94040' text-anchor='start' font-weight='normal'>wraps past 255</text>
<text x='590.0' y='84.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>Why:</text>
<text x='590.0' y='101.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>the sum (240 - checker + target)</text>
<text x='590.0' y='118.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>is done in one byte, so for a</text>
<text x='590.0' y='135.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>person's checker it wraps round</text>
<text x='590.0' y='152.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>past 255 once the target is 2+</text>
<text x='590.0' y='169.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>steps (16+ lb) heavier.</text>
<text x='590.0' y='186.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='590.0' y='203.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>Recorded knockdown rates</text>
<text x='590.0' y='220.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>(target heavier / same / lighter):</text>
<text x='590.0' y='237.0' font-size='12' fill='#c94040' text-anchor='start' font-weight='normal'>person 48% / 15% / 7%</text>
<text x='590.0' y='254.0' font-size='12' fill='#3b82c4' text-anchor='start' font-weight='normal'>computer 15% / 27% / 34%</text>
<text x='590.0' y='271.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='590.0' y='288.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>CB check: C to burst, then B to</text>
<text x='590.0' y='305.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>switch away before contact: the</text>
<text x='590.0' y='322.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>computer's line, but double the</text>
<text x='590.0' y='339.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>charging / roughing risk.</text>
<text x='110.0' y='424.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Light checkers on heavy carriers is the person's best check; a heavy person-controlled checker on a light man almost never works.</text>
</svg>
