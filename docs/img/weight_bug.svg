<svg xmlns='http://www.w3.org/2000/svg' width='820' height='470' viewBox='0 0 820 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>The weight bug</title>
<rect width='820' height='470' fill='#ffffff'/>
<text x='410.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>The weight bug (Genesis): how hard it is to knock a man down</text>
<text x='410.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>The game's knockdown number: lower is easier (at or below the hit's impact, he goes down for sure; above it, a roll).</text>
<line x1='110.0' y1='80.0' x2='110.0' y2='360.0' stroke='#d9e2ec' stroke-width='1' />
<text x='110.0' y='378.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>-64</text>
