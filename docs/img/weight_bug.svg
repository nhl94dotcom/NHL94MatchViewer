<text x='222.5' y='378.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>-32</text>
<line x1='278.8' y1='80.0' x2='278.8' y2='360.0' stroke='#d9e2ec' stroke-width='1' />
<text x='278.8' y='378.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>-16</text>
