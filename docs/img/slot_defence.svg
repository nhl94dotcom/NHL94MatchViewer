<svg xmlns='http://www.w3.org/2000/svg' width='820' height='390' viewBox='0 0 820 390' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>Keep them out of your slot</title>
<rect width='820' height='390' fill='#ffffff'/>
<text x='410.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Keep them out of your slot (Genesis): who was in it, and the chance of a goal</text>
<text x='410.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>With the other team carrying the puck in your end: a goal by them within the next 3 seconds. 23 recorded league games.</text>
<line x1='300.0' y1='76.0' x2='300.0' y2='314.0' stroke='#d9e2ec' stroke-width='1' />
<text x='300.0' y='332.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>0%</text>
<line x1='384.0' y1='76.0' x2='384.0' y2='314.0' stroke='#d9e2ec' stroke-width='1' />
<text x='384.0' y='332.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>5%</text>
<line x1='468.0' y1='76.0' x2='468.0' y2='314.0' stroke='#d9e2ec' stroke-width='1' />
<text x='468.0' y='332.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>10%</text>
<line x1='552.0' y1='76.0' x2='552.0' y2='314.0' stroke='#d9e2ec' stroke-width='1' />
<text x='552.0' y='332.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>15%</text>
<line x1='636.0' y1='76.0' x2='636.0' y2='314.0' stroke='#d9e2ec' stroke-width='1' />
<text x='636.0' y='332.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>20%</text>
<line x1='720.0' y1='76.0' x2='720.0' y2='314.0' stroke='#d9e2ec' stroke-width='1' />
<text x='720.0' y='332.0' font-size='11' fill='#52606d' text-anchor='middle' font-weight='normal'>25%</text>
<text x='290.0' y='101.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Their carrier</text>
<rect x='300' y='84' width='383.0' height='26' rx='4' fill='#3b82c4'/>
<text x='689.0' y='101.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>23%</text>
<text x='723.0' y='101.0' font-size='11' fill='#52606d' text-anchor='start' font-weight='normal'>(9% of the time)</text>
<text x='290.0' y='141.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>An attacker without the puck, open</text>
<rect x='300' y='124' width='208.3' height='26' rx='4' fill='#3b82c4'/>
<text x='514.3' y='141.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>12%</text>
<text x='548.3' y='141.0' font-size='11' fill='#52606d' text-anchor='start' font-weight='normal'>(15% of the time)</text>
<text x='290.0' y='181.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>An attacker without the puck, covered</text>
<rect x='300' y='164' width='225.1' height='26' rx='4' fill='#3b82c4'/>
<text x='531.1' y='181.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>13%</text>
<text x='565.1' y='181.0' font-size='11' fill='#52606d' text-anchor='start' font-weight='normal'>(4% of the time)</text>
<text x='290.0' y='221.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Nobody attacking, none of yours</text>
<rect x='300' y='204' width='258.7' height='26' rx='4' fill='#3b82c4'/>
<text x='564.7' y='221.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>15%</text>
<text x='598.7' y='221.0' font-size='11' fill='#52606d' text-anchor='start' font-weight='normal'>(36% of the time)</text>
<text x='290.0' y='261.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Nobody attacking, one of yours</text>
<rect x='300' y='244' width='169.7' height='26' rx='4' fill='#3b82c4'/>
<text x='475.7' y='261.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>10%</text>
<text x='509.7' y='261.0' font-size='11' fill='#52606d' text-anchor='start' font-weight='normal'>(28% of the time)</text>
<text x='290.0' y='301.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal'>Nobody attacking, two or more of yours</text>
<rect x='300' y='284' width='156.2' height='26' rx='4' fill='#3b82c4'/>
<text x='462.2' y='301.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>9%</text>
<text x='496.2' y='301.0' font-size='11' fill='#52606d' text-anchor='start' font-weight='normal'>(8% of the time)</text>
<text x='24.0' y='356.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>The slot: within 35 units of the middle and about 33 feet of the goal line.</text>
<text x='24.0' y='376.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>The puck in your slot is the worst. One defender in an empty slot cuts the danger by a third; a second adds nothing.</text>
</svg>
