<svg xmlns='http://www.w3.org/2000/svg' width='900' height='660' viewBox='0 0 900 660' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>NHL '95 stick and body fixes in computer games</title>
<rect width='900' height='660' fill='#ffffff'/>
<text x='450.0' y='30.0' font-size='18' fill='#1f2933' text-anchor='middle' font-weight='bold'>NHL '95's stick and body fixes, in computer games</text>
<text x='450.0' y='52.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>Two bugs in checkpuckcoll, where a skater meets a loose puck: the stick's reach test always passes, and the body test is never reached.</text>
<text x='450.0' y='70.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>With the body fix skaters block about 12 more pucks a game; the stick fix cuts quick steals of loose pucks by about 40%.</text>
<text x='70.0' y='116.0' font-size='14' fill='#1f2933' text-anchor='start' font-weight='bold'>Body blocks, a game</text>
