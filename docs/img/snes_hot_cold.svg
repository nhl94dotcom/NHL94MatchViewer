<svg xmlns='http://www.w3.org/2000/svg' width='860' height='418' viewBox='0 0 860 418' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>SNES hot and cold</title>
<rect width='860' height='418' fill='#ffffff'/>
<text x='430.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>SNES ratings screen: a number just below the band's middle means MAXED in play</text>
<text x='430.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>The hot / cold bug: a "cold" rating (shown low in its band) plays at 15, the highest there is.</text>
<line x1='200.0' y1='74.0' x2='200.0' y2='350.0' stroke='#d9e2ec' stroke-width='1' />
<text x='200.0' y='70.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>30</text>
<line x1='280.0' y1='74.0' x2='280.0' y2='350.0' stroke='#d9e2ec' stroke-width='1' />
<text x='280.0' y='70.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>40</text>
<line x1='360.0' y1='74.0' x2='360.0' y2='350.0' stroke='#d9e2ec' stroke-width='1' />
<text x='360.0' y='70.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>50</text>
<line x1='440.0' y1='74.0' x2='440.0' y2='350.0' stroke='#d9e2ec' stroke-width='1' />
<text x='440.0' y='70.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>60</text>
<line x1='520.0' y1='74.0' x2='520.0' y2='350.0' stroke='#d9e2ec' stroke-width='1' />
<text x='520.0' y='70.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>70</text>
<line x1='600.0' y1='74.0' x2='600.0' y2='350.0' stroke='#d9e2ec' stroke-width='1' />
<text x='600.0' y='70.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>80</text>
<line x1='680.0' y1='74.0' x2='680.0' y2='350.0' stroke='#d9e2ec' stroke-width='1' />
<text x='680.0' y='70.0' font-size='10' fill='#52606d' text-anchor='middle' font-weight='normal'>90</text>
<text x='148.0' y='100.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='bold'>rating step 1</text>
<rect x='196.0' y='84' width='32.0' height='22' fill='#c94040' fill-opacity='0.75'/>
<rect x='232.0' y='84' width='36.0' height='22' fill='#3b82c4' fill-opacity='0.55'/>
<line x1='232.0' y1='81.0' x2='232.0' y2='109.0' stroke='#1f2933' stroke-width='2' />
<text x='199.0' y='99.0' font-size='11' fill='#ffffff' text-anchor='start' font-weight='bold'>15</text>
<text x='274.0' y='99.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>plays 2-5</text>
<text x='148.0' y='146.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='bold'>rating step 2</text>
<rect x='268.0' y='130' width='32.0' height='22' fill='#c94040' fill-opacity='0.75'/>
<rect x='304.0' y='130' width='36.0' height='22' fill='#3b82c4' fill-opacity='0.55'/>
<line x1='304.0' y1='127.0' x2='304.0' y2='155.0' stroke='#1f2933' stroke-width='2' />
<text x='271.0' y='145.0' font-size='11' fill='#ffffff' text-anchor='start' font-weight='bold'>15</text>
<text x='346.0' y='145.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>plays 5-8</text>
<text x='148.0' y='192.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='bold'>rating step 3</text>
<rect x='340.0' y='176' width='44.0' height='22' fill='#c94040' fill-opacity='0.75'/>
<rect x='392.0' y='176' width='72.0' height='22' fill='#3b82c4' fill-opacity='0.55'/>
<line x1='392.0' y1='173.0' x2='392.0' y2='201.0' stroke='#1f2933' stroke-width='2' />
<text x='343.0' y='191.0' font-size='11' fill='#ffffff' text-anchor='start' font-weight='bold'>15</text>
<text x='470.0' y='191.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>plays 7-10</text>
<text x='148.0' y='238.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='bold'>rating step 4</text>
<rect x='464.0' y='222' width='64.0' height='22' fill='#c94040' fill-opacity='0.75'/>
<rect x='536.0' y='222' width='72.0' height='22' fill='#3b82c4' fill-opacity='0.55'/>
<line x1='536.0' y1='219.0' x2='536.0' y2='247.0' stroke='#1f2933' stroke-width='2' />
<text x='467.0' y='237.0' font-size='11' fill='#ffffff' text-anchor='start' font-weight='bold'>15</text>
<text x='614.0' y='237.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>plays 10-13</text>
<text x='148.0' y='284.0' font-size='12' fill='#1f2933' text-anchor='end' font-weight='bold'>rating step 5</text>
<rect x='608.0' y='268' width='64.0' height='22' fill='#c94040' fill-opacity='0.75'/>
<rect x='680.0' y='268' width='72.0' height='22' fill='#3b82c4' fill-opacity='0.55'/>
<line x1='680.0' y1='265.0' x2='680.0' y2='293.0' stroke='#1f2933' stroke-width='2' />
<text x='611.0' y='283.0' font-size='11' fill='#ffffff' text-anchor='start' font-weight='bold'>15</text>
<text x='758.0' y='283.0' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal'>plays 12-15</text>
<rect x='160' y='314' width='18' height='12' fill='#c94040' fill-opacity='0.75'/>
<text x='184.0' y='325.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>shown just below the band's middle: plays at 15 (maxed)</text>
<rect x='540' y='314' width='18' height='12' fill='#3b82c4' fill-opacity='0.55'/>
<text x='564.0' y='325.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal'>at or above the middle: plays normally</text>
<text x='40.0' y='354.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>The black tick is the band's middle (hot / cold 0). Each rating has its own hot / cold byte, so read every number separately.</text>
<text x='40.0' y='372.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>About 46% of all ratings are maxed this way each game. Checked against the user's Edit Lines screenshots: all 99 numbers fit.</text>
<text x='40.0' y='390.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Maxed Aggression means more penalties (31 of 52 recorded); maxed Stick Handling means wobbling instead of falling.</text>
</svg>
