<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='470' viewBox='0 0 1000 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='1000' height='470' fill='white'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52606d'/></marker></defs>
<text x='24' y='30' font-size='17' font-weight='bold' fill='#1f2933'>How the simulator fits together</text>
<text x='24' y='62' font-size='13' font-weight='bold' fill='#2563eb'>GENESIS</text>
<text x='24' y='262' font-size='13' font-weight='bold' fill='#0d9488'>SNES</text>
<rect x='24' y='72' width='210' height='110' rx='8' fill='#eff6ff' stroke='#2563eb' stroke-width='1.5'/>
<text x='36' y='94' font-size='14' font-weight='bold' fill='#1f2933'>Test ROM</text>
<text x='36' y='114' font-size='12' fill='#52606d'>built from the disassembly</text>
<text x='36' y='131' font-size='12' fill='#52606d'>+ a size-neutral hook in doshot</text>
<text x='36' y='148' font-size='12' fill='#52606d'>(records and overrides the launch)</text>
<rect x='24' y='272' width='210' height='110' rx='8' fill='#f0fdfa' stroke='#0d9488' stroke-width='1.5'/>
<text x='36' y='294' font-size='14' font-weight='bold' fill='#1f2933'>Retail ROM</text>
<text x='36' y='314' font-size='12' fill='#52606d'>unmodified</text>
<text x='36' y='331' font-size='12' fill='#52606d'>release found by the puck</text>
<text x='36' y='348' font-size='12' fill='#52606d'>coming loose</text>
<rect x='268' y='72' width='210' height='110' rx='8' fill='#eff6ff' stroke='#2563eb' stroke-width='1.5'/>
<text x='280' y='94' font-size='14' font-weight='bold' fill='#1f2933'>The shot's dice</text>
<text x='280' y='114' font-size='12' fill='#52606d'>doshot ported exactly (129/129)</text>
<text x='280' y='131' font-size='12' fill='#52606d'>perfect and scatter split exactly</text>
<text x='280' y='148' font-size='12' fill='#52606d'>120 moments per spot</text>
<rect x='268' y='272' width='210' height='110' rx='8' fill='#f0fdfa' stroke='#0d9488' stroke-width='1.5'/>
<text x='280' y='294' font-size='14' font-weight='bold' fill='#1f2933'>The shot's dice</text>
<text x='280' y='314' font-size='12' fill='#52606d'>the release frame replayed</text>
<text x='280' y='331' font-size='12' fill='#52606d'>from random seeds: the game's</text>
<text x='280' y='348' font-size='12' fill='#52606d'>own draws; 16 moments x 24 seeds</text>
<rect x='512' y='165' width='220' height='120' rx='8' fill='#f8fafc' stroke='#9aa5b1' stroke-width='1.5'/>
<text x='524' y='187' font-size='14' font-weight='bold' fill='#1f2933'>Harness (headless emulator)</text>
<text x='524' y='207' font-size='12' fill='#52606d'>libretro core driven from Python</text>
<text x='524' y='224' font-size='12' fill='#52606d'>shooter held on a spot, goalie sets</text>
<text x='524' y='241' font-size='12' fill='#52606d'>wind-up, aim, release, play out</text>
<text x='524' y='258' font-size='12' fill='#52606d'>until decided; 30 processes</text>
<rect x='766' y='72' width='210' height='110' rx='8' fill='#f8fafc' stroke='#9aa5b1' stroke-width='1.5'/>
<text x='778' y='94' font-size='14' font-weight='bold' fill='#1f2933'>Checks</text>
<text x='778' y='114' font-size='12' fill='#52606d'>natural shots, empty net</text>
<text x='778' y='131' font-size='12' fill='#52606d'>fast stop vs full play-out</text>
<text x='778' y='148' font-size='12' fill='#52606d'>spots too close left out</text>
<rect x='766' y='272' width='210' height='110' rx='8' fill='#f8fafc' stroke='#9aa5b1' stroke-width='1.5'/>
<text x='778' y='294' font-size='14' font-weight='bold' fill='#1f2933'>Results</text>
<text x='778' y='314' font-size='12' fill='#52606d'>scoring maps (best aim)</text>
<text x='778' y='331' font-size='12' fill='#52606d'>goal types, frame by frame</text>
<text x='778' y='348' font-size='12' fill='#52606d'>write-ups in the mechanics docs</text>
<line x1='234' y1='127' x2='268' y2='127' stroke='#52606d' stroke-width='1.6' marker-end='url(#a)'/>
<line x1='234' y1='327' x2='268' y2='327' stroke='#52606d' stroke-width='1.6' marker-end='url(#a)'/>
<line x1='478' y1='127' x2='512' y2='200' stroke='#52606d' stroke-width='1.6' marker-end='url(#a)'/>
<line x1='478' y1='327' x2='512' y2='255' stroke='#52606d' stroke-width='1.6' marker-end='url(#a)'/>
<line x1='732' y1='200' x2='766' y2='140' stroke='#52606d' stroke-width='1.6' marker-end='url(#a)'/>
<line x1='732' y1='250' x2='766' y2='310' stroke='#52606d' stroke-width='1.6' marker-end='url(#a)'/>
<text x='24' y='420' font-size='12' fill='#52606d'>Genesis: about 4,500 frames a second per process (Genesis Plus GX); SNES: about 3,500 (Snes9x). One emulator per process.</text>
<text x='24' y='440' font-size='12' fill='#52606d'>Genesis map: about 2 hours on 30 processes. SNES map: 2.07 million shots, about 1 hour 50.</text>
</svg>