<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='720' viewBox='0 0 1180 720' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>The Down goal, NHL '94 Genesis</title>
<rect width='1180' height='720' fill='#ffffff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<text x='590.0' y='30.0' font-size='18' fill='#1f2933' text-anchor='middle' font-weight='bold'>Why the bottom (Down) net concedes a few more goals: NHL '94 Genesis</text>
<text x='590.0' y='52.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>Down / Up = goals at the bottom net / goals at the top net. Both teams defend each net over a game (home attacks up in periods 1 and 3).</text>
<rect x='44.0' y='140.0' width='192.0' height='480.0' rx='32.0' fill='#f7f9fb' stroke='#52606d' stroke-width='1.5'/>
<line x1='52.0' y1='168.8' x2='228.0' y2='168.8' stroke='#c94040' stroke-width='1.5' />
<line x1='52.0' y1='591.2' x2='228.0' y2='591.2' stroke='#c94040' stroke-width='1.5' />
<line x1='44.0' y1='309.6' x2='236.0' y2='309.6' stroke='#7aa7d6' stroke-width='3' />
<line x1='44.0' y1='450.4' x2='236.0' y2='450.4' stroke='#7aa7d6' stroke-width='3' />
<line x1='44.0' y1='380.0' x2='236.0' y2='380.0' stroke='#c94040' stroke-width='2' stroke-dasharray='6 4' />
<rect x='124.0' y='157.6' width='32.0' height='11.200000000000001' fill='#ffffff' stroke='#1f2933' stroke-width='2'/>
<rect x='124.0' y='591.2' width='32.0' height='11.200000000000001' fill='#ffffff' stroke='#1f2933' stroke-width='2'/>
<text x='140.0' y='130.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>UP (top net)</text>
<text x='140.0' y='640.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>DOWN (bottom net)</text>
<text x='262.0' y='108.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Shoulder-save bobble (top only)</text>
<text x='262.0' y='124.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>A held high shot sits behind the top goalie</text>
<text x='262.0' y='139.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>and can be knocked in.</text>
<text x='262.0' y='154.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Adds Up goals: 2 of 218 recorded</text>
<text x='262.0' y='178.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Low shots knocked away uncounted</text>
<text x='262.0' y='194.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>League: going up, 6% more shots on goal</text>
<text x='262.0' y='209.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>counted but 3% fewer goals.</text>
<text x='262.0' y='224.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Moves shot counts, not goals</text>
<text x='262.0' y='392.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Shots aimed down: scatter halved</text>
<text x='262.0' y='408.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>doshot halves the depth scatter when the</text>
<text x='262.0' y='423.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>aim points down (bottom net only).</text>
<text x='262.0' y='438.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>About 1 goal in 270 (NOSE4Web's aim fix)</text>
<text x='262.0' y='462.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Goalie's stick spots not mirrored</text>
<text x='262.0' y='478.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>The facing-up frames' blade points aren't</text>
<text x='262.0' y='493.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>the top goalie's mirror image.</text>
<text x='262.0' y='508.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Computer goalie 1.03 -> 1.00 when mirrored</text>
<text x='262.0' y='532.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Rebounds about 5% faster</text>
<text x='262.0' y='548.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>A byte-handling quirk speeds rebounds</text>
<text x='262.0' y='563.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>off the bottom goalie.</text>
<text x='262.0' y='578.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Bottom only</text>
<text x='925.0' y='86.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>Down / Up goals, with 95% ranges</text>
<text x='800.0' y='106.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>0.8</text>
<text x='852.6' y='106.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>0.9</text>
<text x='899.7' y='106.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.0</text>
<text x='942.3' y='106.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.1</text>
<text x='981.1' y='106.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.2</text>
<text x='1016.9' y='106.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.3</text>
<text x='1050.0' y='106.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.4</text>
<text x='560.0' y='130.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Real games</text>
<text x='788.0' y='152.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>League, every game since 2013</text>
<text x='1062.0' y='149.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.03 (1.03-1.04)</text>
<text x='1062.0' y='162.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>650,136 goals</text>
<text x='788.0' y='188.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>Our 38 recorded games, per shot</text>
<text x='1062.0' y='185.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.05 (0.86-1.29)</text>
<text x='1062.0' y='198.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>135 / 137 goals</text>
<text x='560.0' y='238.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Harness: computer goalie (paired)</text>
<text x='788.0' y='260.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>Retail</text>
<text x='1062.0' y='257.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.03 (0.84-1.26)</text>
<text x='1062.0' y='270.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>136 / 132 goals</text>
<text x='788.0' y='296.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>Aim fix (scatter not halved)</text>
<text x='1062.0' y='293.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.02 (0.84-1.25)</text>
<text x='1062.0' y='306.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>135 / 132</text>
<text x='788.0' y='332.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>Stick fix (blade spots mirrored)</text>
<text x='1062.0' y='329.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.00 (0.82-1.22)</text>
<text x='1062.0' y='342.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>133 / 133</text>
<text x='560.0' y='382.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Harness: goalie standing still</text>
<text x='788.0' y='404.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>Started from recorded goalie spots</text>
<text x='1062.0' y='401.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.23 (1.09-1.38)</text>
<text x='1062.0' y='414.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>310 / 253</text>
<text x='788.0' y='440.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>Both 22 out from the goal line</text>
<text x='1062.0' y='437.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.12 (0.98-1.26)</text>
<text x='1062.0' y='450.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>298 / 267</text>
