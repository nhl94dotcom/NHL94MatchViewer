<text x='590.0' y='688.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>Harness: NOSE4Web's 1,308 recorded shot launches replayed at both nets with the same clock, goalie and random draws (paired).</text>
<text x='590.0' y='704.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>Ranges: the league and recorded games from goal counts; the replays from the launches that scored at one net only. Sources: STUDY_NOTES, "Down goal".</text>
