<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='960' viewBox='0 0 1180 960' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>The Down goal, NHL '94 Genesis</title>
<rect width='1180' height='960' fill='#ffffff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<text x='590.0' y='30.0' font-size='18' fill='#1f2933' text-anchor='middle' font-weight='bold'>Why the bottom (Down) net concedes a few more goals: NHL '94 Genesis</text>
<text x='590.0' y='52.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>Down / Up = goals at the bottom net / goals at the top net. Both teams defend each net over a game (home attacks up in periods 1 and 3).</text>
<text x='590.0' y='70.0' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='bold'>The biggest factor is penalties: the bottom net's defenders are called 5.4% more often, so the team attacking down gets more power plays.</text>
<rect x='44.0' y='160.0' width='192.0' height='480.0' rx='32.0' fill='#f7f9fb' stroke='#52606d' stroke-width='1.5'/>
<line x1='52.0' y1='188.8' x2='228.0' y2='188.8' stroke='#c94040' stroke-width='1.5' />
<line x1='52.0' y1='611.2' x2='228.0' y2='611.2' stroke='#c94040' stroke-width='1.5' />
<line x1='44.0' y1='329.6' x2='236.0' y2='329.6' stroke='#7aa7d6' stroke-width='3' />
<line x1='44.0' y1='470.4' x2='236.0' y2='470.4' stroke='#7aa7d6' stroke-width='3' />
<line x1='44.0' y1='400.0' x2='236.0' y2='400.0' stroke='#c94040' stroke-width='2' stroke-dasharray='6 4' />
<rect x='124.0' y='177.6' width='32.0' height='11.200000000000001' fill='#ffffff' stroke='#1f2933' stroke-width='2'/>
<rect x='124.0' y='611.2' width='32.0' height='11.200000000000001' fill='#ffffff' stroke='#1f2933' stroke-width='2'/>
<text x='140.0' y='150.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>UP (top net)</text>
<text x='140.0' y='660.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>DOWN (bottom net)</text>
<text x='262.0' y='128.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Shoulder-save bobble (top only)</text>
<text x='262.0' y='144.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>A held high shot sits behind the top goalie</text>
<text x='262.0' y='159.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>and can be knocked in.</text>
<text x='262.0' y='174.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Adds Up goals: 2 of 218 recorded</text>
<text x='262.0' y='198.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Low shots knocked away uncounted</text>
<text x='262.0' y='214.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>League: going up, 6% more shots on goal</text>
<text x='262.0' y='229.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>counted but 3% fewer goals.</text>
<text x='262.0' y='244.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Moves shot counts, not goals</text>
<text x='262.0' y='268.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Goalie interference called more here</text>
<text x='262.0' y='284.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>Called only while the goalie is within 25 of</text>
<text x='262.0' y='299.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>his goal line. People stand the top goalie</text>
<text x='262.0' y='314.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>shallower (19.4 out against 24.7), inside it more.</text>
<text x='262.0' y='329.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Interference on attackers here: league 1.125</text>
<text x='262.0' y='412.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Shots aimed down: scatter halved</text>
<text x='262.0' y='428.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>doshot halves the depth scatter when the</text>
<text x='262.0' y='443.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>aim points down (bottom net only).</text>
<text x='262.0' y='458.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>About 1 goal in 270 (NOSE4Web's aim fix)</text>
<text x='262.0' y='482.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Goalie's stick spots not mirrored</text>
<text x='262.0' y='498.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>The facing-up frames' blade points aren't</text>
<text x='262.0' y='513.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>the top goalie's mirror image.</text>
<text x='262.0' y='528.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Computer goalie 1.03 -> 1.00 when mirrored</text>
<text x='262.0' y='552.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Rebounds about 5% faster</text>
<text x='262.0' y='568.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>A byte-handling quirk speeds rebounds</text>
<text x='262.0' y='583.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>off the bottom goalie.</text>
<text x='262.0' y='598.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Bottom only</text>
<text x='262.0' y='622.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>People trip attackers more here</text>
<text x='262.0' y='638.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>People's B-pokes knock down attackers coming</text>
<text x='262.0' y='653.0' font-size='11.5' fill='#52514e' text-anchor='start' font-weight='normal'>down the screen more (recorded 120 / 102).</text>
<text x='262.0' y='668.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Tripping calls: league 1.092</text>
<text x='925.0' y='110.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='bold'>Down / Up goals, with 95% ranges</text>
<text x='800.0' y='130.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>0.8</text>
<text x='852.6' y='130.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>0.9</text>
<text x='899.7' y='130.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.0</text>
