<text x='1016.9' y='130.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.3</text>
<text x='1050.0' y='130.0' font-size='10.5' fill='#52606d' text-anchor='middle' font-weight='normal'>1.4</text>
<text x='560.0' y='154.0' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>Real games</text>
<text x='788.0' y='176.0' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal'>League, every game since 2013</text>
<text x='1062.0' y='173.0' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal'>1.03 (1.03-1.04)</text>
<text x='1062.0' y='186.0' font-size='10' fill='#52606d' text-anchor='start' font-weight='normal'>650,136 goals</text>
