<rect x='133.0' y='80.0' width='234.0' height='190.8' fill='#e8833a' fill-opacity='0.06'/>
<line x1='133.0' y1='270.8' x2='367.0' y2='270.8' stroke='#3b82c4' stroke-width='3' />
<line x1='133.0' y1='350.0' x2='367.0' y2='350.0' stroke='#c94040' stroke-width='2' />
<line x1='133.0' y1='108.8' x2='367.0' y2='108.8' stroke='#c94040' stroke-width='1.5' />
<rect x='232.0' y='95.79999999999998' width='36.0' height='13' fill='#ffffff' stroke='#1f2933'/>
