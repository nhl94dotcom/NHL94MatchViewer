<rect x='272.5' y='125.0' width='99.0' height='126.0' fill='none' stroke='#3f9d5c' stroke-width='1.5' stroke-dasharray='5 4'/>
<circle cx='322.0' cy='188.0' r='6.0' fill='#3f9d5c' fill-opacity='1' stroke='#1f2933' stroke-width='1.5'/>
