<text x='520.0' y='100.0' font-size='12' fill='#3b82c4' text-anchor='start' font-weight='bold'>Left of centre, outside the zone</text>
<text x='520.0' y='117.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>deep on the left: 80 from the middle,</text>
<text x='520.0' y='134.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>180 up (between circle and corner).</text>
<text x='520.0' y='151.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='168.0' font-size='12' fill='#3f9d5c' text-anchor='start' font-weight='bold'>Right of centre, outside the zone</text>
<text x='520.0' y='185.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>the same on the right.</text>
<text x='520.0' y='202.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='219.0' font-size='12' fill='#e8833a' text-anchor='start' font-weight='bold'>Inside the attacking zone</text>
<text x='520.0' y='236.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>in front of the net (0, 215).</text>
<text x='520.0' y='253.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='270.0' font-size='12' fill='#1f2933' text-anchor='start' font-weight='bold'>Scatter (Passing is the accuracy):</text>
<text x='520.0' y='287.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>solid box: Passing 15, +/-25 across;</text>
<text x='520.0' y='304.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>dashed: Passing 0, +/-55 across;</text>
<text x='520.0' y='321.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>along the ice +/-20 to 70.</text>
<text x='520.0' y='338.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'></text>
<text x='520.0' y='355.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>He turns to face up the ice first,</text>
<text x='520.0' y='372.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>so a sideways skater flips late.</text>
<text x='520.0' y='389.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>A goalie flips to about centre ice.</text>
<text x='60.0' y='440.0' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>Circles: example passers. Dots: the spots. Not seen in a recording yet; from the NHL94SNES code (assdumpin, DumpInTarget).</text>
</svg>
