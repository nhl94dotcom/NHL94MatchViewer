<svg xmlns='http://www.w3.org/2000/svg' width='860' height='460.0' viewBox='0 0 860 460.0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<title>The SNES flip</title>
<rect width='860' height='460.0' fill='#ffffff'/>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<text x='430.0' y='28.0' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='bold'>Where the SNES flip goes (Y with the puck)</text>
<text x='430.0' y='48.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='normal'>The team attacks UP. The computer takes the flip over: the spot depends on which SIDE OF CENTRE he's on, not his facing.</text>
<rect x='133.0' y='80.0' width='234.0' height='324.0' fill='#f7fbff' stroke='#1f2933' stroke-width='1.5'/>
